# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
  - "apps/docs"
  - "cloudflare/control-plane"
# Packaging fetches optional binaries for both desktop CPU targets. This lived
# in package.json's "pnpm" field, which pnpm 10.33 ignores — it printed a
# warning on every command and, more to the point, silently was not applied.
supportedArchitectures:
  cpu:
    - arm64
    - x64
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
  workerd: false # use the platform package; no postinstall script needed
onlyBuiltDependencies:
  - electron
  - esbuild

# Keep the SDK's WebSocket client outside the package-release waiting period.
overrides:
  '@daytona/sdk@0.218.0>ws': 8.21.3

# Runtime diagnostics use NATION support; algorithms and license notices are unchanged.
patchedDependencies:
  '@mermaid-js/parser@2.0.0': patches/mermaid-js__parser2.0.0.patch
  'chevrotain@11.1.2': patches/chevrotain11.1.2.patch
  'elkjs@0.9.3': patches/elkjs0.9.3.patch
  'hast-util-to-jsx-runtime@2.3.6': patches/hast-util-to-jsx-runtime2.3.6.patch
  'marked@16.4.2': patches/marked16.4.2.patch
  'mermaid@12.0.0': patches/mermaid12.0.0.patch
  'react-markdown@10.1.0': patches/react-markdown10.1.0.patch
