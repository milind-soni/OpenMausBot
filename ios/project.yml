# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open AstraCompanion.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: AstraCompanion
options:
  bundleIdPrefix: com.astra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CompanionCore:
    path: .

schemes:
  AstraCompanion:
    build:
      targets:
        AstraCompanion: all
        AstraCompanionUITests: [test]
    test:
      config: Debug
      targets:
        - AstraCompanionUITests

targets:
  AstraCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppShared
      - path: Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - target: AstraCompanionWidgets
      - target: AstraShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astra.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The catalog lives in App/, which is already a source path.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/AstraCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.astra.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.astra.app
          - $(AppIdentifierPrefix)group.com.astra.shared
    info:
      path: App/Info.plist
      properties:
        # What appears under the icon. Distinct from the desktop app on
        # purpose: someone may well have both, and two identical labels on
        # one person's devices is a small cruelty.
        CFBundleDisplayName: AstraMobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        AstraKeychainAccessGroup: $(AppIdentifierPrefix)group.com.astra.shared
        # The bot's Live Activity — its face and ask in the Dynamic Island
        # and on the lock screen.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.astra.companion.pairing
            CFBundleURLSchemes:
              - astra
        # REQUIRED, and easy to lose. Without a launch screen iOS runs the
        # app in compatibility scaling: letterboxed inside black bars, with
        # everything drawn oversized, on every modern iPhone. An empty
        # dictionary is enough — it just has to exist.
        #
        # This cannot be an INFOPLIST_KEY_* build setting. Those are only
        # read when Xcode generates the Info.plist itself, and this target
        # supplies one, so they are silently ignored.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without these two, NWBrowser returns no results at all — silently.
        # It looks exactly like "no computers on this network", which is a
        # confusing hour if you don't know to look here.
        NSLocalNetworkUsageDescription: >-
          Astra finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          Astra uses the camera only to scan a pairing QR code shown on
          your computer.
        NSMicrophoneUsageDescription: >-
          AstraMobile listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: >-
          AstraMobile converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
          - _astra._tcp
        # The companion listener is plain HTTP on a local address. ATS has
        # to be told, and this is the narrowest way to say it: local
        # networking only, not a blanket exception.
        #
        # NSAllowsLocalNetworking covers the private ranges — 10/8,
        # 172.16/12, 192.168/16, .local — and that is the whole LAN story.
        # It does *not* cover Tailscale: a tailnet address lives in
        # 100.64.0.0/10, the CGNAT range, which ATS treats as ordinary
        # public internet and blocks over plain HTTP. The address cannot be
        # exempted (ATS exceptions are by name, not by subnet), but the
        # MagicDNS name can be, and every tailnet name ends in ts.net — so
        # connect by name and this one entry covers every machine you own.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  # Native navigation coverage uses bundled synthetic data and no pairing.
  AstraCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AstraCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astra.app.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AstraCompanion

  # The system share sheet can send a link, text, image, or document straight
  # to a paired bot without first opening the containing app. Connection
  # metadata lives in the App Group; the bearer remains in the shared
  # Keychain access group.
  AstraShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: AppShared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astra.app.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: true
    entitlements:
      path: ShareExtension/AstraShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.astra.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.astra.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Astra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AstraKeychainAccessGroup: $(AppIdentifierPrefix)group.com.astra.shared
        # ATS is evaluated for URLSession work performed by the extension too.
        # Mirror the containing app's narrow local/Tailscale exceptions so a
        # share can reach the same already-paired routes. Local-network privacy
        # usage text remains on the containing app, per Apple's extension rules.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 4

  # The Live Activity lives in a widget extension. It shares the mascot's
  # drawing and data with the app, and the activity contract in Shared/.
  AstraCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/AstraAvatar.swift
      - path: App/AstraFaceData.swift
    dependencies:
      # AstraAvatar draws whichever body a bot wears, and the body catalog and
      # its path parser live in CompanionCore. The extension shares the
      # drawing with the app, so it has to share the catalog too.
      - package: CompanionCore
        product: CompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astra.app.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AstraMobile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
