# XcodeGen spec. The .xcodeproj is generated, not committed — a project
# file is a merge-conflict machine and nothing in it is worth reviewing.
#
#   brew install xcodegen && cd ios && xcodegen generate && open OpenMausCompanion.xcodeproj
#
# XcodeGen is a development tool, not a dependency of the app: the app
# itself has none. If you'd rather not install it, make an iOS App target
# in Xcode by hand, add the App/ folder, and add the local CompanionCore
# package — the Info.plist keys below are the part that is easy to miss.
name: BotFleet
options:
  bundleIdPrefix: app.botfleet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CompanionCore:
    path: .

targets:
  BotFleet:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - target: BotFleetWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: app.botfleet.companion.pairing
            CFBundleURLSchemes:
              - botfleet
              - openmausbot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          BotFleet finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          BotFleet uses the camera only to scan a pairing QR code shown on
          your computer.
        NSMicrophoneUsageDescription: >-
          BotFleet listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: >-
          BotFleet converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
          - _openmausbot._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            botfleet.app:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  BotFleetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/MausAvatar.swift
      - path: App/MausFaceData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.botfleet.widgets
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: BotFleet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
