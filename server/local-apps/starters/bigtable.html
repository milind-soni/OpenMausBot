<!doctype html>
<html lang="en">
<head>

<title>Rowfall · orders</title>
<style>
:root{
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#0e0f11; --panel:#121316; --raise:#17181c; --line:#222429; --line2:#2c2f35;
  --text:#e3e5e9; --dim:#8b9099; --faint:#5b6068; --ghost:#3a3d44;
  --lime:#c6f432; --lime-d:rgba(198,244,50,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}
body{font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
#app{display:grid;height:100vh;grid-template-columns:1fr auto;grid-template-rows:52px 64px 1fr 34px}
.top{grid-column:1;grid-row:1;display:flex;align-items:center;gap:18px;padding:0 0 0 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.wm{font-weight:600;font-size:15px;letter-spacing:-.01em}
.crumb{color:var(--dim);font-size:13px;display:flex;gap:7px;align-items:center}
.crumb b{color:var(--text);font-weight:500}
.crumb i{color:var(--ghost);font-style:normal}
.tag{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:3px 7px;letter-spacing:.02em}
.tabs{display:flex;gap:2px;margin-left:16px}
.tabs span{font-size:12.5px;color:var(--faint);padding:6px 10px;border-radius:5px}
.tabs span.on{color:var(--text);background:var(--raise)}
.sample{margin-left:auto;margin-right:22px;font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px}
.sample:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ghost)}
.qbar{grid-column:1;grid-row:2;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);min-width:0}
.tb{font:500 12.5px var(--ui);color:var(--dim);background:transparent;border:1px solid var(--line2);border-radius:6px;height:30px;padding:0 11px;display:flex;align-items:center;gap:7px;cursor:pointer}
.tb:hover{color:var(--text);border-color:#3a3e45}
.tb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.q{font-family:var(--mono);font-size:13px;color:#b9bdc5;display:flex;align-items:center;gap:8px;margin-left:8px;white-space:nowrap;min-width:0;overflow:hidden;height:36px;padding:0 12px;border-radius:6px;background:#121316;border:1px solid var(--line);flex:1}
.q .kw{color:#6f7580}
.q .id{color:#e3e5e9}
.q .str{color:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 6px 0 9px;border-radius:5px;background:var(--lime-d);border:1px solid rgba(198,244,50,.35);color:#e9f8b8;font-size:12px;
  transform-origin:left center;animation:chipIn .45s cubic-bezier(.2,.9,.25,1.15) both}
.chip .x{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;color:#9fb35c;cursor:pointer;font-size:12px;line-height:1}
@keyframes chipIn{from{opacity:0;transform:translateY(6px) scale(.85)}to{opacity:1;transform:none}}
.counter{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);border-bottom:1px solid var(--line);width:470px;padding:16px 24px 0 26px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:linear-gradient(180deg,#121316,#0f1012)}
.c-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.c-top .speed{letter-spacing:.02em;text-transform:none;color:var(--dim)}

.c-main .num{font-family:var(--mono);font-weight:500;font-size:50px;letter-spacing:-.035em;color:var(--lime);line-height:1;min-width:262px;text-align:right}
.c-main .of{font-family:var(--mono);font-size:15px;color:var(--dim);white-space:nowrap}
main{grid-column:1/3;grid-row:3;position:relative;display:grid;grid-template-columns:1fr 132px;min-height:0}
#grid{display:block;width:100%;height:100%;cursor:default}
#rail{display:block;width:100%;height:100%;border-left:1px solid var(--line);cursor:pointer;touch-action:none}
.wrap{position:relative;min-width:0;min-height:0}
footer{grid-column:1/3;grid-row:4;border-top:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 22px;font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden}

  .counter{width:380px;padding:14px 20px 0 20px}
  .c-main .num{font-size:40px;min-width:210px}
  .c-main .of{font-size:13px}
  main{grid-template-columns:1fr 112px}
  .tabs{display:none}
}

<div id="app">
  <header class="top">
    <div class="brand">

<script>
// ============================================================================================
// Generator. Every row is a pure function of its index. The same source runs in the scan workers.
// ============================================================================================
function makeGen(){
  const N = 12000000, DAYS = 731, EPOCH = Date.UTC(2024,0,1);
  const REGIONS = ["Northmark","Calder Reach","Vellmoor","Orrin Isles","Southfold","Hale Plains"];
  const CATS = ["Home","Electronics","Apparel","Garden","Books","Toys","Grocery","Beauty"];
  const NOUNS = [
    ["Linen throw","Stoneware mug","Walnut tray","Wool rug","Glass carafe","Oak stool","Table lamp","Cotton duvet","Ceramic vase","Wall clock","Bath towel","Candle set"],
    ["Wireless earbuds","Wall charger","USB-C hub","Smart plug","Pocket speaker","E-reader sleeve","Webcam","Keyboard","Power bank","Display cable","LED strip","Tablet stand"],
    ["Rain shell","Merino tee","Denim jacket","Wool beanie","Canvas sneaker","Linen shirt","Fleece vest","Chino","Rib socks","Knit scarf","Leather belt","Hoodie"],
    ["Seed tray","Pruning shears","Hose reel","Clay planter","Compost bin","Trowel","Bird feeder","Raised bed","Watering can","Grow light","Garden gloves","Solar lantern"],
    ["Field guide","Cookbook","Sketchbook","Atlas","Poetry reader","Novel","Puzzle book","Journal","Travel guide","Comic box set","History primer","Notebook set"],
    ["Wooden blocks","Kite","Jigsaw 1000","Plush fox","Train set","Marble run","Card game","Yo-yo","Balsa glider","Stacking rings","Dollhouse","Building kit"],
    ["Olive oil","Green tea","Oat milk","Coffee beans","Rye bread","Honey jar","Sea salt","Pasta","Dark chocolate","Rice","Granola","Hot sauce"],
    ["Face serum","Lip balm","Hand cream","Shampoo","Clay mask","Sunscreen","Body wash","Eye cream","Nail kit","Hair oil","Toner","Soap bar"]];
  const COL = ["sage","charcoal","oat","slate","ember","fern","dune","ink","moss","pearl"];
  const VAR = [COL,COL,COL,COL,["hardcover","paperback","vol. 1","vol. 2","vol. 3","pocket","large print","2nd ed.","boxed","annotated"],COL,
    ["250 g","500 g","1 kg","2 kg","organic","6-pack","12-pack","family","single","sampler"],["15 ml","30 ml","50 ml","100 ml","travel","refill","duo","trio","unscented","sensitive"]];
  const CAT_PRICE = [38,129,46,31,17,27,8.5,23];
  const CAT_MARGIN = [31,8,38,27,22,26,13,44];
  const CAT_W = [.16,.13,.18,.08,.10,.08,.17,.10];
  const REG_W = [.25,.21,.18,.14,.12,.10];

  function h32(x){ x|=0; x^=x>>>16; x=Math.imul(x,0x7feb352d); x^=x>>>15; x=Math.imul(x,0x846ca68b); x^=x>>>16; return x>>>0; }
  const U = 1/4294967296;
  const di = (y,m,d) => Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5);

  // ---- per-day tables: order density, promotions, mix ----
  const doy = new Uint16Array(DAYS), month = new Uint8Array(DAYS), dow = new Uint8Array(DAYS);
  for (let d=0; d<DAYS; d++){ const t = new Date(EPOCH + d*864e5); dow[d]=t.getUTCDay(); month[d]=t.getUTCMonth();
    doy[d] = Math.round((t - Date.UTC(t.getUTCFullYear(),0,1))/864e5); }
  const ev = new Float64Array(DAYS).fill(1), promo = new Uint8Array(DAYS);
  const setEv = (d, m, p) => { ev[d]=m; promo[d]=p; };
  [[2024,11,28,[2.6,2.15,1.8,1.5]],[2025,11,27,[2.95,2.4,1.95,1.6]],[2024,7,16,[1.8,1.45]],[2025,7,15,[2.05,1.6]]]
    .forEach(([y,m,d,ms]) => ms.forEach((k,j) => setEv(di(y,m,d)+j, k, 1)));
  const OUTAGE = di(2025,3,18); setEv(OUTAGE, 0.42, 0);
  const ORRIN_OPEN = di(2024,6,3);
  const w = new Float64Array(DAYS); let tot = 0;
  const WEEK = [1.13,0.93,0.95,0.97,1.0,1.05,1.17];
  for (let d=0; d<DAYS; d++){
    const y = doy[d];
    const season = 1 + 0.24*Math.exp(-(((y-348)/20)**2)) + 0.07*Math.cos(2*Math.PI*(y-200)/365) - 0.12*Math.exp(-(((y-22)/12)**2));
    const trend = 1 + 0.62*d/DAYS + (d>ORRIN_OPEN ? 0.09*Math.min(1,(d-ORRIN_OPEN)/120) : 0);
    const noise = 1 + 0.05*((h32(d*977+3)*U)-0.5);
    w[d] = trend*WEEK[dow[d]]*season*ev[d]*noise; tot += w[d];
  }
  const C = new Int32Array(DAYS+1); let acc=0;
  for (let d=0; d<DAYS; d++){ acc += w[d]; C[d+1] = Math.round(N*acc/tot); }
  C[DAYS] = N;
  const catCum = new Float64Array(DAYS*8), regCum = new Float64Array(DAYS*6);
  for (let d=0; d<DAYS; d++){
    const m = month[d], y = doy[d];
    const cw = CAT_W.slice();
    const xmas = Math.exp(-(((y-345)/25)**2));
    cw[5] *= 1 + 1.5*xmas; cw[1] *= 1 + 0.75*xmas + (promo[d]?0.6:0);
    cw[3] *= 1 + 1.3*Math.exp(-(((y-130)/38)**2));
    cw[7] *= 1 + 0.25*xmas;
    let s=0; for (let k=0;k<8;k++) s+=cw[k]; let a=0; for (let k=0;k<8;k++){ a+=cw[k]/s; catCum[d*8+k]=a; }
    const rw = REG_W.slice(); rw[3] = d < ORRIN_OPEN ? 0 : REG_W[3]*Math.min(1, 0.25 + 0.75*(d-ORRIN_OPEN)/150);
    s=0; for (let k=0;k<6;k++) s+=rw[k]; a=0; for (let k=0;k<6;k++){ a+=rw[k]/s; regCum[d*6+k]=a; }
  }
  // ---- items ----
  const itemBase = new Float64Array(96*10), itemMg = new Float64Array(960), itemPh = new Float64Array(960);
  for (let g=0; g<960; g++){
    const c = (g/120)|0, h1=h32(g*7919+13)*U, h2=h32(g*104729+7)*U, h3=h32(g*1299709+5)*U;
    const z = (h1+h2+h3-1.5)*2;
    itemBase[g] = CAT_PRICE[c]*Math.exp(0.48*z);
    itemMg[g] = (h32(g*31+1)*U-0.5)*10; itemPh[g] = h3*6.283;
  }
  function dayOf(i){ let lo=0, hi=DAYS-1; while (lo<hi){ const mid=(lo+hi+1)>>1; if (C[mid] <= i) lo=mid; else hi=mid-1; } return lo; }

  // row(i, o): fills o with the fields of row i. Money is in integer cents.
  function row(i, o){
    const b = h32(i ^ 0x5bd1e995) ^ 0x2545f491;
    const r = k => h32(b + Math.imul(k, 0x9e3779b9)) * U;
    const d = dayOf(i); o.day = d;
    const f = (i - C[d]) / (C[d+1] - C[d]);
    let s = Math.floor(86400*(f + 0.45*Math.sin(6.283185307*f)/6.283185307)); o.sec = s<0?0:s>86399?86399:s;
    let u = r(1), k = 0; const ro = d*6; while (k<5 && u > regCum[ro+k]) k++; o.region = k;
    u = r(2); k = 0; const co = d*8; while (k<7 && u > catCum[co+k]) k++; const cat = k; o.cat = cat;
    const it = Math.floor(120*Math.pow(r(3),1.7)); const g = cat*120 + it; o.item = g;
    const pr = promo[d] && r(4) < 0.62;
    let price = Math.max(1, Math.round(itemBase[g]*(1 + 0.045*d/DAYS)))*100 - 1;
    if (pr) price = Math.round(price*0.8);
    o.price = price; o.promo = pr ? 1 : 0;
    const u5 = r(5);
    let q = cat===6 ? 1 + Math.floor(-Math.log(1-u5)*2.4) : 1 + Math.floor(-Math.log(1-u5)*0.52); if (q>24) q=24;
    o.qty = q; o.amount = q*price;
    o.margin = Math.round((CAT_MARGIN[cat] + itemMg[g] + (r(6)-0.5)*18 - (pr?12:0))*10)/10;
    const age = DAYS-1-d, u7 = r(7);
    let st;
    if (age === 0) st = u7<0.68 ? 2 : u7<0.95 ? 1 : 4;
    else if (age <= 1) st = u7<0.3 ? 2 : u7<0.96 ? 1 : 4;
    else if (age <= 5) st = u7<0.78 ? 1 : u7<0.975 ? 0 : 4;
    else {
      const ret = cat===2 ? 0.11 : cat===1 ? 0.05 : cat===6 ? 0.008 : 0.025;
      const can = d === OUTAGE ? 0.21 : 0.022;
      st = u7 < can ? 4 : u7 < can+ret ? 3 : 0;
    }
    o.status = st; o.u8 = r(8);
    return o;
  }
  function itemName(g){ const c=(g/120)|0, k=g%120; return [NOUNS[c][k%12], VAR[c][(k/12)|0]]; }
  return { N, DAYS, EPOCH, C, REGIONS, CATS, OUTAGE, row, dayOf, itemName, itemBase, itemPh, h32, promo, ev };
}

// Worker body (runs inside a Blob worker; makeGen is prepended to it).
function workerMain(){
  const G = makeGen(); const o = {};
  self.onmessage = (e) => {
    const m = e.data;
    if (m.kind === "scan"){
      const { a, b, B } = m, N = G.N;
      const cube = new Float64Array(5*6*8*3), bk = new Float64Array(B*6);
      const qh = new Float64Array(25), ph = new Float64Array(40), ah = new Float64Array(40), mh = new Float64Array(50);
      const seen = new Uint8Array(960);
      for (let i=a; i<b; i++){
        G.row(i, o);
        const c3 = ((o.status*6 + o.region)*8 + o.cat)*3;
        cube[c3]++; cube[c3+1] += o.amount; cube[c3+2] += o.amount*o.margin;
        const bi = Math.floor(i*B/N); bk[bi*6+o.status]++; bk[bi*6+5] += o.amount;
        qh[o.qty]++;
        let x = Math.floor(Math.log10(o.price/100)/3.4*40); ph[x<0?0:x>39?39:x]++;
        x = Math.floor(Math.log10(o.amount/100)/4.4*40); ah[x<0?0:x>39?39:x]++;
        x = Math.floor((o.margin+30)/2); mh[x<0?0:x>49?49:x]++;
        seen[o.item] = 1;
        if (((i-a) & 262143) === 262143) self.postMessage({ kind:"progress", id:m.id, done:i-a+1 });
      }
      self.postMessage({ kind:"scan", id:m.id, cube, bk, qh, ph, ah, mh, seen, rows:b-a }, [cube.buffer, bk.buffer, qh.buffer, ph.buffer, ah.buffer, mh.buffer, seen.buffer]);
    } else if (m.kind === "sort"){
      const { a, b, col, K } = m; const n = b-a;
      const keys = new Uint8Array(n), counts = new Uint32Array(K);
      for (let i=a; i<b; i++){ G.row(i, o); const k = o[col]; keys[i-a] = k; counts[k]++; }
      const off = new Uint32Array(K); for (let k=1;k<K;k++) off[k] = off[k-1] + counts[k-1];
      const out = new Uint32Array(n);
      for (let j=0; j<n; j++) out[off[keys[j]]++] = a + j;
      self.postMessage({ kind:"sort", id:m.id, out, counts }, [out.buffer, counts.buffer]);
    }
  };
}
</script>
<script>
(() => {
"use strict";
const G = makeGen();
const N = G.N;
const STATUS = ["delivered","shipped","processing","returned","cancelled"];
const ST_COL = [ // pill bg, pill text, rail colour
  ["#1d2a1f","#9cc39b","#3c4a3e"], ["#1b2533","#8fb0d9","#38506e"], ["#2f2717","#d8b36a","#7d6431"],
  ["#272033","#b39ad9","#5e4a80"], ["#33201e","#d98a7e","#8a463d"]];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const grid = $("grid"), rail = $("rail");
const ctx = grid.getContext("2d"), rctx = rail.getContext("2d");
const buf = document.createElement("canvas"), bctx = buf.getContext("2d");
const UI = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif", MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
const LIME = "#c6f432";

// ---------- formatting (hand-rolled, no toLocaleString in the frame loop) ----------
function fmtInt(n){ n = Math.floor(n); const s = String(n); let out = ""; for (let i=0;i<s.length;i++){ if (i && (s.length-i)%3===0) out += ","; out += s[i]; } return out; }
function fmtCents(c){ const d = Math.floor(c/100), r = c%100; return "$" + fmtInt(d) + "." + (r<10?"0":"") + r; }
function fmtM(cents){ const v = cents/1e8; return v >= 100 ? "$" + v.toFixed(1) + "M" : "$" + v.toFixed(2) + "M"; }
function fmtK(n){ return n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "k" : String(n); }
const p2 = (n) => (n<10?"0":"") + n;
const DAYSTR = []; const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
for (let d=0; d<G.DAYS; d++){ const t = new Date(G.EPOCH + d*864e5); DAYSTR.push(t.getUTCFullYear() + "-" + p2(t.getUTCMonth()+1) + "-" + p2(t.getUTCDate())); }
function fmtTs(d, s){ return DAYSTR[d] + " " + p2((s/3600)|0) + ":" + p2(((s/60)|0)%60) + ":" + p2(s%60); }
function pad8(n){ const s = String(n); return "00000000".slice(s.length) + s; }

// ---------- columns ----------
const COLS = [
  { key:"order_id",  name:"order_id",   type:"varchar",   w:122, min:110, sort:"index", pri:9 },
  { key:"ordered_at",name:"ordered_at", type:"timestamp", w:170, min:156, sort:"index", pri:9 },
  { key:"buyer",     name:"buyer",      type:"varchar",   w:96,  min:90,  pri:1 },
  { key:"region",    name:"region",     type:"enum(6)",   w:126, min:104, sort:"key", K:6, pri:8 },
  { key:"category",  name:"category",   type:"enum(8)",   w:116, min:96,  sort:"key", K:8, field:"cat", pri:8 },
  { key:"item",      name:"item",       type:"varchar",   w:236, min:184, grow:3, pri:7 },
  { key:"qty",       name:"qty",        type:"int32",     w:58,  min:50,  align:"r", pri:6 },
  { key:"unit_price",name:"unit_price", type:"decimal",   w:100, min:88,  align:"r", pri:4 },
  { key:"amount",    name:"amount",     type:"decimal",   w:116, min:102, align:"r", pri:8 },

function layout(){

  W = Math.round(r.width); H = Math.round(r.height); RW = Math.round(rr.width);

// ---------- scan (Web Workers over all 12M rows) ----------
const SCAN = { done:false, ms:0, workers:0, progress:0, cube:null, bk:null, qh:null, ph:null, ah:null, mh:null, distinctItems:0, B:2048 };
let workerURL = null, pool = [];
function makeWorkers(n){
  try {
    const src = makeGen.toString() + "\n(" + workerMain.toString() + ")();";
    workerURL = URL.createObjectURL(new Blob([src], { type:"text/javascript" }));
    for (let i=0;i<n;i++) pool.push(new Worker(workerURL));

function runScan(){

    if (!SCAN.cube){ SCAN.cube = new Float64Array(res.cube.length); SCAN.bk = new Float64Array(res.bk.length);
      SCAN.qh = new Float64Array(25); SCAN.ph = new Float64Array(40); SCAN.ah = new Float64Array(40); SCAN.mh = new Float64Array(50); SCAN.seen = new Uint8Array(960); }
    for (const k of ["cube","bk","qh","ph","ah","mh"]) { const A = SCAN[k], R = res[k]; for (let i=0;i<A.length;i++) A[i] += R[i]; }
    for (let i=0;i<960;i++) SCAN.seen[i] |= res.seen[i];
  };
  const finish = () => {
    SCAN.ms = performance.now() - t0; SCAN.done = true;
    SCAN.distinctItems = SCAN.seen.reduce((s,v)=>s+v,0);
    railStatic = null; dirty = true; updateFooter(); scanResolve();
  };
  if (makeWorkers(n)){
    SCAN.workers = n;
    const prog = new Array(n).fill(0); let left = n;
    pool.forEach((wk, id) => {
      const a = Math.floor(N*id/n), b = Math.floor(N*(id+1)/n);
      wk.onmessage = (e) => { const m = e.data;
        if (m.kind === "progress"){ prog[id] = m.done; SCAN.progress = prog.reduce((s,v)=>s+v,0)/N; updateFooter(); }
        else if (m.kind === "scan"){ prog[id] = m.rows; merge(m); if (--left === 0) finish(); } };
      wk.postMessage({ kind:"scan", id, a, b, B });

    SCAN.workers = 0; const o = {}; let i = 0; const CH = 400000;
    const res = { cube:new Float64Array(720), bk:new Float64Array(B*6), qh:new Float64Array(25), ph:new Float64Array(40), ah:new Float64Array(40), mh:new Float64Array(50), seen:new Uint8Array(960) };
    const step = () => { const end = Math.min(N, i+CH);
      for (; i<end; i++){ G.row(i,o); const c3=((o.status*6+o.region)*8+o.cat)*3; res.cube[c3]++; res.cube[c3+1]+=o.amount; res.cube[c3+2]+=o.amount*o.margin;
        const bi=Math.floor(i*B/N); res.bk[bi*6+o.status]++; res.bk[bi*6+5]+=o.amount; res.qh[o.qty]++;
        let x=Math.floor(Math.log10(o.price/100)/3.4*40); res.ph[x<0?0:x>39?39:x]++; x=Math.floor(Math.log10(o.amount/100)/4.4*40); res.ah[x<0?0:x>39?39:x]++;

}
let scanResolve; const scanReady = new Promise((ok) => { scanResolve = ok; });

function sortBy(col){ // returns a promise; real counting sort over all rows in the workers
  const field = col.field || col.key, K = col.K;
  if (!pool.length) return Promise.reject(new Error("no workers"));
  const t0 = performance.now(), n = pool.length;
  return new Promise((ok) => {
    const parts = new Array(n); let left = n;
    pool.forEach((wk, id) => {
      const a = Math.floor(N*id/n), b = Math.floor(N*(id+1)/n);
      wk.onmessage = (e) => { if (e.data.kind !== "sort") return; parts[id] = e.data; if (--left === 0) {
        const perm = new Uint32Array(N); let p = 0;
        for (let k=0;k<K;k++) for (let w=0; w<n; w++){ const pt = parts[w]; let off = 0; for (let j=0;j<k;j++) off += pt.counts[j];
          perm.set(pt.out.subarray(off, off+pt.counts[k]), p); p += pt.counts[k]; }
        ok({ perm, ms: performance.now()-t0, workers:n });
      } };
      wk.postMessage({ kind:"sort", id, a, b, col:field, K });
    });
  });
}

function histBars(g, arr, x, y, w, h, from, to, color, logY){

// aggregate animation state
function buildAgg(){
  const top = Math.floor(S.pos); const items = []; let delivered = 0, r = top;
  const need = visRows + 4;
  while (delivered < need && r < N){ const d = rowData(r); items.push(d); if (d.status === 0) delivered++; r++; }
  return { t0: performance.now(), items, P: pivotData(), L: pivotLayout(), done: false, start: top, frac: S.pos - top };
}
function aggFrame(){
  const A = S.agg, t = REDUCED ? 99 : (performance.now() - A.t0)/1000;
  // phase 1 (0.15–1.0 s): non-matching rows collapse out. phase 2 (1.05–1.85 s): rows fly into their region row.
  const pf = ease(clamp01((t - 0.15)/0.85)), pg = clamp01((t - 1.05)/0.8);

      for (let b=b0;b<b1;b++) for (let s=0;s<5;s++){ st[s] += SCAN.bk[b*6+s]; tot += SCAN.bk[b*6+s]; }

}

// ---------- frame loop ----------
function frame(t){
  if (S.glide) S.glide(t);
  else if (!S.agg){ // wheel smoothing
    const d = S.target - S.pos; if (Math.abs(d) > 0.002){ S.pos += Math.abs(d) < 0.02 ? d : d*0.22; dirty = true; }
  }
  if (SCAN.done && PROFILE_T < 1){ if (!profT0) profT0 = t; PROFILE_T = REDUCED ? 1 : easeOut(clamp01((t - profT0)/900)); dirty = true; }
  const v = S.pos - S.prevPos; S.prevPos = S.pos;
  S.speedRows = v; if (Math.abs(v) > 0.001) dirty = true;
  if (S.agg && !S.agg.done){ dirty = true; if ((performance.now() - S.agg.t0) > 4200) S.agg.done = true; }
  if (dirty){ dirty = false; render(); }

// ---------- glides ----------
function glideTo(to, totalS){
  return new Promise((ok) => {
    S.target = S.pos; S.focus = -1;
    const from = S.pos, D = to - from;
    if (REDUCED || Math.abs(D) < 1){ S.pos = S.target = S.prevPos = to; S.focus = to; dirty = true; ok(); return; }
    // velocity profile: smoothstep ramp (Ta), cruise (Tc), exponential settle (Td) that lands exactly on `to`.
    const T = totalS, Ta = T*0.26, Tc = T*0.2, Td = T - Ta - Tc, eps = 0.35, AD = Math.abs(D);
    let lo = 0.5, hi = 40, k = 5, V = 0, R0 = 0;
    for (let it=0; it<60; it++){ k = (lo+hi)/2; V = AD/(Ta/2 + Tc + 1/k); R0 = V/k; if (Math.log(Math.max(1.0001, R0/eps)) - k*Td > 0) lo = k; else hi = k; }
    if (R0 < 2){ k = 3/Td; V = AD/(Ta/2 + Tc + 1/k); R0 = V/k; }
    const eT = Math.exp(-k*Td), sgn = Math.sign(D);
    const posAt = (s) => {
      if (s < Ta){ const u = s/Ta; return V*Ta*(u*u*u - 0.5*u*u*u*u); } // ∫ smoothstep-ish ramp: v = V(3u²-2u³)
      const dA = V*Ta*0.5;
      if (s < Ta + Tc) return dA + V*(s - Ta);
      const tau = Math.min(Td, s - Ta - Tc); const R = R0*(Math.exp(-k*tau) - eT)/(1 - eT);
      return AD - R;
    };
    // correct ramp integral so distance matches exactly
    const scale = AD / (V*Ta*0.5 + V*Tc + R0);
    const t0 = performance.now();
    S.glide = (now) => {
      const s = (now - t0)/1000;
      if (s >= T){ S.pos = S.target = to; S.glide = null; S.focus = to; dirty = true; setTimeout(ok, 260); return; }
      let p = posAt(s); if (s >= Ta + Tc) p = AD - (AD - p); else p *= scale;
      S.pos = from + sgn*Math.min(AD, p); S.target = S.pos; dirty = true;
    };
  });
}

  s.innerHTML = '<span class="kw" style="color:#9fb35c">GROUP BY</span> region, category<span class="x" title="Remove">×</span>'; s.querySelector(".x").addEventListener("click", () => clearAgg());
  el.appendChild(s);
  await new Promise((ok) => setTimeout(ok, REDUCED ? 30 : 3200));
}
function clearAgg(){
  S.agg = null; $("chips").innerHTML = "";
  $("ordkw").style.display = $("ordcol").style.display = $("orddir").style.display = "";
  dirty = true;
}
// ---------- input ----------
function syncOrder(){ $("ordcol").textContent = S.sortCol; $("orddir").textContent = S.dir > 0 ? "ASC" : "DESC"; }
grid.addEventListener("wheel", (e) => {
  e.preventDefault(); if (S.glide || S.agg) return;
  let dy = e.deltaY * (e.deltaMode === 1 ? RH*3 : e.deltaMode === 2 ? bodyH : 1);
  let rows = dy/RH; if (e.shiftKey || e.altKey) rows *= 2500;
  S.target = Math.max(0, Math.min(maxPos(), S.target + rows));
}, { passive:false });
let sorting = false;
grid.addEventListener("click", async (e) => {
  const r = grid.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (S.agg) return;
  if (y < HH){
    const c = visCols.find((c) => x >= c.x && x < c.x + c.cw); if (!c || !c.sort || sorting) return;
    const same = S.sortCol === c.key;
    if (c.sort === "index"){ S.perm = null; S.dir = same ? -S.dir : 1; S.sortCol = c.key; $("sortnote").textContent = ""; }
    else if (same){ S.dir = -S.dir; }
    else {
      sorting = true; $("sortnote").textContent = `sorting ${fmtInt(N)} rows by ${c.key}…`;
      try { const res = await sortBy(c); S.perm = res.perm; S.dir = 1; S.sortCol = c.key;
        $("sortnote").textContent = `sorted ${fmtInt(N)} rows by ${c.key} in ${(res.ms/1000).toFixed(2)} s · ${res.workers} workers`; }
      catch (err) { $("sortnote").textContent = "sort needs workers"; }
      sorting = false;
    }
    syncOrder(); S.focus = -1; dirty = true; railStatic = railStatic; return;
  }
  const row = Math.floor(S.pos + (y - HH)/RH); if (row >= 0 && row < N){ S.focus = row === S.focus ? -1 : row; dirty = true; }
});
grid.addEventListener("mousemove", (e) => {
  const r = grid.getBoundingClientRect(), y = e.clientY - r.top;
  const row = y < HH ? -1 : Math.floor(S.pos + (y - HH)/RH); if (row !== S.hover){ S.hover = row; dirty = true; }
});
grid.addEventListener("mouseleave", () => { S.hover = -1; dirty = true; });
let railDrag = false;
function railTo(e){
  const r = rail.getBoundingClientRect(), y = e.clientY - r.top; const rs = railStatic || buildRailStatic();
  const span = Math.floor(bodyH/RH);
  const p = Math.max(0, Math.min(maxPos(), (y - rs.top)/rs.h*N - span/2));
  S.pos = S.target = p; dirty = true;
}
rail.addEventListener("pointerdown", (e) => { if (S.glide) return; if (S.agg) clearAgg(); railDrag = true; rail.setPointerCapture(e.pointerId); S.focus = -1; railTo(e); });
rail.addEventListener("pointermove", (e) => { if (railDrag) railTo(e); });
rail.addEventListener("pointerup", () => { railDrag = false; });
$("btnGroup").addEventListener("click", () => { if (!S.agg) aggregate(); });
$("btnFilter").addEventListener("click", () => { if (!S.agg) aggregate(); });
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.agg) clearAgg();
  if (S.agg || S.glide) return;
  const page = Math.floor(bodyH/RH) - 1;
  if (e.key === "PageDown") S.target = Math.min(maxPos(), S.target + page);
  if (e.key === "PageUp") S.target = Math.max(0, S.target - page);
  if (e.key === "ArrowDown") S.target = Math.min(maxPos(), S.target + 1);
  if (e.key === "ArrowUp") S.target = Math.max(0, S.target - 1);
  if (e.key === "End") glideTo(maxPos(), 2.4);
  if (e.key === "Home") glideTo(0, 2.4);
});
let rz; addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { layout(); makePills(); }); });

// ---------- boot ----------
(async () => {
  await document.fonts.ready;
  layout(); makePills(); updateFooter();
  // A card picture is 880 px wide and never gets input: the 12M-row scan waits there for a first sign of a person.
  const FIRST = ["pointermove","pointerdown","keydown","wheel","resize"];
  const scanOnce = () => { for (const type of FIRST) removeEventListener(type, scanOnce, true); runScan(); };
  if (innerWidth > 900) runScan(); else for (const type of FIRST) addEventListener(type, scanOnce, true);
  render();
  requestAnimationFrame(() => { document.documentElement.dataset.ready = "1"; });
  requestAnimationFrame(frame);
})();
})();
</script>
</body>
