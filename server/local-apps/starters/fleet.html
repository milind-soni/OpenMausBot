<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corridor · Fleet control</title>
<style>
:root{--bg:#070b10;--panel:rgba(9,13,19,.88);--line:#1c2733;--line2:#26323f;--ink:#d8e2eb;--ink2:#8b9bab;--ink3:#566676;
  --cyan:#3fd0ff;--amber:#ffb020;--red:#ff4d5e;--green:#4fd39a;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pw:clamp(300px,18vw,352px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}canvas#map.drag{cursor:grabbing}canvas#map.hover{cursor:pointer}
.mono{font-family:var(--mono)}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.micro{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
/* top bar */
.top{position:fixed;left:24px;right:24px;top:20px;height:60px;display:flex;align-items:center;gap:18px;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;height:60px;padding:0 18px 0 14px;width:var(--pw)}
.brand svg{width:30px;height:30px}
.brand b{font:600 17px/1 var(--ui);letter-spacing:-.01em}.brand span{display:block;font:11px/1.3 var(--mono);color:var(--ink3);margin-top:4px;letter-spacing:.02em}
.kpis{flex:1;display:flex;height:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;pointer-events:auto;overflow:hidden}
.kpi{flex:1;padding:10px 16px 0;border-left:1px solid var(--line);min-width:0}.kpi:first-child{border-left:0;flex:1.25}
.kpi .v{font:500 21px/1.2 var(--mono);letter-spacing:-.02em;margin-top:5px;white-space:nowrap}.kpi .v small{font-size:12px;color:var(--ink3);margin-left:4px}
.kpi.clock .v{font-size:24px;color:#fff}.kpi.clock .v small{color:var(--ink2)}
.sim{pointer-events:auto;height:60px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 16px;width:var(--pw)}
.pill{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--line2);border-radius:20px;padding:5px 9px}
.sim .net{font:11px var(--mono);color:var(--ink3)}
/* left: exceptions */
.exc{left:24px;top:92px;width:var(--pw);bottom:148px;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 13px/1 var(--ui);letter-spacing:.01em}.ph .count{font:600 11px/1 var(--mono);color:#1a0c0e;background:var(--red);border-radius:10px;padding:4px 7px}
.ph .tabs{display:flex;gap:10px;font:11px var(--mono);color:var(--ink3)}.ph .tabs b{color:var(--ink);font-weight:500}
.list{flex:1;overflow:hidden;position:relative}
.ev{display:grid;grid-template-columns:3px 52px 1fr;gap:0 12px;padding:11px 16px 11px 0;border-bottom:1px solid rgba(28,39,51,.7);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s,background 1.2s}
.ev.new{background:rgba(255,77,94,.07)}.ev.enter{transform:translateY(-14px);opacity:0}
.ev i{grid-row:span 2;border-radius:0 2px 2px 0}.ev .t{font:500 12px/1.3 var(--mono);color:var(--ink2)}
.ev .ti{font:500 13px/1.3 var(--ui);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .su{grid-column:3;font:11px/1.4 var(--mono);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev .k{grid-column:2;font:10px/1.4 var(--mono);color:var(--ink3);letter-spacing:.06em}
.empty{padding:40px 20px;color:var(--ink3);font:12px var(--mono);text-align:center}
/* right */
.right{right:24px;top:92px;width:var(--pw);bottom:148px;display:flex;flex-direction:column;overflow:hidden}
.dep{padding:12px 16px 4px}
.drow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-bottom:1px solid rgba(28,39,51,.7)}
.drow .n{font:500 13px var(--ui)}.drow .n small{font:10px var(--mono);color:var(--ink3);margin-left:6px;letter-spacing:.06em}
.drow .p{font:500 13px var(--mono);text-align:right}
.drow canvas{grid-column:span 2;width:100%;height:26px;display:block}
.drow .io{grid-column:span 2;font:10.5px var(--mono);color:var(--ink3);display:flex;justify-content:space-between}
.corr{padding:6px 16px 14px;border-top:1px solid var(--line);flex:1;min-height:0}
.crow{display:grid;grid-template-columns:54px 1fr 64px;align-items:center;gap:10px;padding:7px 0;font:12px var(--mono)}
.crow .nm{color:var(--ink)}.crow .bar{height:6px;border-radius:3px;background:#141c25;overflow:hidden}.crow .bar i{display:block;height:100%;border-radius:3px}
.crow .d{text-align:right;color:var(--ink2)}.crow .via{grid-column:2/4;margin-top:-4px;font:10.5px var(--mono);color:var(--ink3)}
/* vehicle card */
.veh{position:absolute;inset:auto 0 0 0;height:56%;background:#0b1118;border-top:1px solid var(--line2);transform:translateY(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.veh.on{transform:none}
.vh{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 10px}
.vh .id{font:600 22px/1 var(--mono);letter-spacing:-.02em}.vh .meta{font:11px/1.5 var(--mono);color:var(--ink3);margin-top:6px}
.st{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:12px;padding:5px 8px;border:1px solid}
.vt{padding:0 16px}.vt canvas{width:100%;height:58px;display:block}
.stops{flex:1;overflow:hidden;padding:4px 16px 12px}
.srow{display:grid;grid-template-columns:18px 46px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(28,39,51,.6);font:11.5px var(--mono);color:var(--ink2)}
.srow .num{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;color:var(--ink3)}
.srow.done .num{background:#15303d;border-color:#2a5466;color:var(--cyan)}.srow .pl{color:var(--ink)}
/* bottom scrubber */
.scrub{left:24px;right:24px;bottom:20px;height:116px;display:grid;grid-template-columns:160px 1fr 290px;align-items:stretch}
.play{display:flex;align-items:center;gap:14px;padding:0 18px;border-right:1px solid var(--line)}
.play button{width:44px;height:44px;border-radius:50%;border:1px solid #2d4a5a;background:#0f2430;color:var(--cyan);display:grid;place-items:center;cursor:pointer}
.play button svg{width:16px;height:16px;fill:currentColor}.play .pz{display:none}.playing .play .pz{display:block}.playing .play .pl{display:none}
.play .tm{font:500 20px/1 var(--mono)}.play .sp{white-space:nowrap;font:10px var(--mono);color:var(--ink3);margin-top:6px;letter-spacing:.06em}
.track{position:relative;cursor:ew-resize;min-height:0;overflow:hidden}.track canvas{position:absolute;left:20px;top:12px;width:calc(100% - 40px);height:calc(100% - 18px);display:block}
.legend{border-left:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:9px;font:11px var(--mono);color:var(--ink2)}
.lg{display:flex;align-items:center;gap:7px;white-space:nowrap}.lg i{width:9px;height:9px;border-radius:50%}
.ramp{height:6px;border-radius:3px;background:linear-gradient(90deg,#24323f,#7a5a1c,#ffb020,#ff6a3d,#ff4d5e);margin-top:2px}
.rampl{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}
/* map chrome */
.mapui{position:fixed;left:calc(var(--pw) + 44px);bottom:196px;display:flex;flex-direction:column;gap:6px}
.mapui button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font:500 16px var(--mono);cursor:pointer}
.scale{position:fixed;left:calc(var(--pw) + 44px);bottom:158px;font:10.5px var(--mono);color:var(--ink2)}
.scale i{display:block;height:6px;border:1px solid var(--ink3);border-top:0;margin-top:4px}
.zoomlvl{position:fixed;left:calc(var(--pw) + 44px);top:96px;font:10.5px var(--mono);color:var(--ink3);letter-spacing:.06em;line-height:1.7}
.zoomlvl b{color:var(--ink2);font-weight:500}
.kpi .micro{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1600px){:root{--pw:280px}.ph .micro{display:none}.kpi{padding:10px 12px 0}}
@media (max-height:950px){.kpi .v{font-size:18px}.kpi.clock .v{font-size:21px}}
</style>
</head>
<body>
<canvas id="map" aria-label="Map of the Kessaly Coast road network with vehicles"></canvas>
<header class="top">
  <div class="brand"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="#0f2430" stroke="#2d4a5a"/><path d="M7 21c4-1 5-11 9-11s4 6 7 6" fill="none" stroke="#3fd0ff" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="21" r="2" fill="#ffb020"/><circle cx="23" cy="16" r="2" fill="#3fd0ff"/></svg>
    <div><b>Corridor</b><span>Kessaly Coast · regional fleet</span></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="sim"><span class="pill">Sample data · simulated day</span><span class="net mono">12 towns · 5 depots · 300 vehicles</span></div>
</header>
<section class="panel exc" aria-label="Exceptions">

</section>
<section class="panel scrub" id="scrub" aria-label="Day timeline">
  <div class="play"><button id="playBtn" aria-label="Play the day"><svg class="pl" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg><svg class="pz" viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg></button>
    <div><div class="tm" id="tm">14:20</div><div class="sp">THU · 12 MAR</div></div></div>

  <div class="legend">
    <div style="display:flex;gap:14px"><span class="lg"><i style="background:var(--cyan)"></i>on time</span><span class="lg"><i style="background:var(--amber)"></i>delayed</span><span class="lg"><i style="background:var(--red)"></i>exception</span></div>
    <div><div class="micro" style="margin-bottom:5px">corridor delay</div><div class="ramp"></div><div class="rampl"><span>free</span><span>+50%</span><span>×2.5</span></div></div>
  </div>
</section>
<div class="zoomlvl" id="zoomlvl"></div>
<div class="scale" id="scale"><span id="scaleTxt">10 km</span><i id="scaleBar"></i></div>
<div class="mapui"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zhome" aria-label="Whole region">⌂</button></div>

<script>
"use strict";
// ———————————————————————————————————————— world ————————————————————————————————————————
// World units are 100 m; the region is 160 × 100 km. Everything below is generated from one seed.
const W = 1600, H = 1000, SEED = 7413;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const GW = 321, GH = 201, CS = W / (GW - 1);
const hgt = new Float32Array(GW * GH);
function heightAt(x, y){
  const wx = x + 90 * (fbm(x / 240 + 3, y / 240) - .5), wy = y + 90 * (fbm(x / 240, y / 240 + 7) - .5);
  let h = (fbm(wx / 330, wy / 330) - .5) * 1.5 + .95 * (x / W) - .75 * (y / H) - .02;
  h -= .32 * Math.exp(-(((x - 620) / 150) ** 2 + ((y - 560) / 120) ** 2));          // a deep bay
  if (h > 0) { const r = 1 - Math.abs(2 * fbm(x / 170 + 11, y / 170 - 4, 5) - 1); h += .9 * h * h * r * r + .25 * h * r; }
  return h;
}
for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) hgt[j * GW + i] = heightAt(i * CS, j * CS);
function hAt(x, y){ const gx = clamp(x / CS, 0, GW - 1.001), gy = clamp(y / CS, 0, GH - 1.001), i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * GW + i;
  return lerp(lerp(hgt[k], hgt[k + 1], fx), lerp(hgt[k + GW], hgt[k + GW + 1], fx), fy); }

// Marching squares: segments of an iso-line over the height grid, as one flat array.
function iso(level, step = 1){
  const out = [];
  for (let j = 0; j < GH - step; j += step) for (let i = 0; i < GW - step; i += step) {
    const a = hgt[j*GW+i]-level, b = hgt[j*GW+i+step]-level, c = hgt[(j+step)*GW+i+step]-level, d = hgt[(j+step)*GW+i]-level;
    const p = [], x0 = i * CS, y0 = j * CS, s = step * CS;
    if ((a > 0) !== (b > 0)) p.push(x0 + s * a / (a - b), y0);

    if ((c > 0) !== (d > 0)) p.push(x0 + s * d / (d - c), y0 + s);

    if (p.length === 8) out.push(p[4], p[5], p[6], p[7]);

}
const segPath = (s) => { const p = new Path2D(); for (let k = 0; k < s.length; k += 4) { p.moveTo(s[k], s[k+1]); p.lineTo(s[k+2], s[k+3]); } return p; };
const coast = segPath(iso(0));
const bathy = [-.06, -.14, -.26].map((l) => segPath(iso(l, 2)));
const contours = [.12, .24, .36, .5, .66, .84].map((l) => segPath(iso(l, 1)));

// Land mass: flood fill from the highest point, so towns and roads stay on the mainland.
const main = new Uint8Array(GW * GH);
{ let top = 0; for (let k = 0; k < hgt.length; k++) if (hgt[k] > hgt[top]) top = k;
  const st = [top]; main[top] = 1;
  while (st.length) { const k = st.pop(), i = k % GW, j = (k / GW) | 0;
    for (const [di, dj] of [[1,0],[-1,0],[0,1],[0,-1]]) { const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= GW || jj >= GH) continue; const kk = jj * GW + ii; if (!main[kk] && hgt[kk] > .012) { main[kk] = 1; st.push(kk); } } } }

// Towns: lowland cells near the sea, kept apart.
const NAMES = ["Vessmouth","Kelderby","Orran","Saltreach","Brindlecross","Maraway","Thessel","Duncliff","Pellow Bay","Ostry","Wrenhaven","Hollin"];
const towns = [];
{ const cands = [];
  for (let n = 0; n < 8000; n++) { const x = R(350, 1190), y = R(120, 770), k = Math.round(y / CS) * GW + Math.round(x / CS);
    if (!main[k]) continue; const h = hgt[k]; if (h < .03 || h > .42) continue;
    let near = 99; for (let a = 0; a < 6.28; a += .52) for (const r of [30, 70, 120]) if (hAt(x + Math.cos(a) * r, y + Math.sin(a) * r) < 0) near = Math.min(near, r);
    cands.push({ x, y, s: (near < 99 ? 70 - near * .4 : 0) + rnd() * 110 - h * 60 }); }
  cands.sort((a, b) => b.s - a.s);
  for (const c of cands) { if (towns.length >= 12) break; if (towns.every((t) => Math.hypot(t.x - c.x, t.y - c.y) > 158)) towns.push({ x: c.x, y: c.y }); }
  towns.forEach((t, i) => { t.name = NAMES[i]; t.pop = Math.round(R(8, 30) + (i < 4 ? 40 : 0)); t.id = i; });
}

// Roads: A* over a coarse grid, cheap in valleys and along roads already built, so corridors share alignments.
const AG = 2, AW = Math.floor((GW - 1) / AG) + 1, AH = Math.floor((GH - 1) / AG) + 1, onRoad = new Uint8Array(AW * AH);
function astar(a, b){
  const toI = (p) => Math.round(p.y / CS / AG) * AW + Math.round(p.x / CS / AG);
  const s = toI(a), g = toI(b), gx = g % AW, gy = (g / AW) | 0;
  const cost = new Float32Array(AW * AH).fill(Infinity), from = new Int32Array(AW * AH).fill(-1), heap = [];
  const push = (k, f) => { heap.push([f, k]); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = 2*i+1, r = l+1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  cost[s] = 0; push(s, 0);
  while (heap.length) { const [, k] = pop(); if (k === g) break; const i = k % AW, j = (k / AW) | 0, hk = hgt[j*AG*GW + i*AG];
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) { if (!di && !dj) continue; const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= AW || jj >= AH) continue;
      const kk = jj * AW + ii, gk = jj*AG*GW + ii*AG; if (!main[gk] || hgt[gk] < .015) continue;
      const step = Math.hypot(di, dj), hh = hgt[gk];
      const c = cost[k] + step * (1 + 55 * Math.abs(hh - hk) + 3 * Math.max(0, hh - .1)) * (onRoad[kk] ? .45 : 1);
      if (c < cost[kk]) { cost[kk] = c; from[kk] = k; push(kk, c + .9 * Math.hypot(ii - gx, jj - gy)); } } }
  if (from[g] < 0) return null;
  const cells = []; for (let k = g; k >= 0; k = from[k]) { cells.push(k); onRoad[k] = 1; if (k === s) break; }
  cells.reverse();
  let pts = cells.map((k) => [(k % AW) * AG * CS, ((k / AW) | 0) * AG * CS]);
  pts[0] = [a.x, a.y]; pts[pts.length - 1] = [b.x, b.y];
  for (let it = 0; it < 3; it++) { const q = [pts[0]]; for (let n = 0; n < pts.length - 1; n++) { const [x0, y0] = pts[n], [x1, y1] = pts[n + 1]; q.push([x0*.75+x1*.25, y0*.75+y1*.25], [x0*.25+x1*.75, y0*.25+y1*.75]); } q.push(pts[pts.length - 1]); pts = q; }
  return pts;
}
const edges = [];

  return animate(ms, (u) => { cam.z = Math.exp(lerp(Math.log(z0), Math.log(z), u)); const cu = 1 - Math.pow(1 - u, 1.6); cam.x = lerp(x0, x, cu); cam.y = lerp(y0, y, cu); }); }

function selectVehicle(id, opts = {}){ const v = typeof id === "number" ? vehicles[id] : id; if (!v) return; S.sel = v; S.follow = opts.follow !== false; dirty = true; panels(true); }


function frame(){
  if (S.follow && S.sel && !S.anim) { const s = stateOf(S.sel, S.t); if (s) { cam.x = lerp(cam.x, s.x, .12); cam.y = lerp(cam.y, s.y, .12); dirty = true; } }
  if (dirty || S.sel) { draw(); dirty = false; }
  if (S.anim || S.playing) panels();
  requestAnimationFrame(frame);
}
addEventListener("resize", resize);
(async () => { await document.fonts.ready;
  resize(); Object.assign(cam, homeCam()); panels(true); draw(); requestAnimationFrame(() => { document.documentElement.dataset.ready = "1"; }); requestAnimationFrame(frame); })();
</script>
