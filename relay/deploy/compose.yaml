# One relay node. Both services use the host's network: the relay listens on 127.0.0.1:8080 only and sees Caddy as
# 127.0.0.1, and Caddy sees each client's real address on 443.
name: omb-relay

services:
  relay:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must name the relay image}
    network_mode: host
    env_file: relay.env
    environment:
      RELAY_HOST: 127.0.0.1
      RELAY_PORT: "8080"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # The relay tells hosts it is restarting and exits within 5 s of SIGTERM.
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: journald
      options: { tag: omb-relay }
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    network_mode: host
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN must be this node's hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    restart: unless-stopped
    depends_on: [relay]
    logging:
      driver: journald
      options: { tag: omb-relay-caddy }

volumes:
  caddy-data:
  caddy-config:
