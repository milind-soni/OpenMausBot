name: ${COMPOSE_PROJECT_NAME:-openmausbot-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/openmausbot-podman:${OMB_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${OMB_DATA_ROOT:?Run setup.sh first}:${OMB_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${OMB_DATA_ROOT}
      OMB_DATA_DIR: ${OMB_DATA_ROOT}/.openmausbot
      OMB_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      OMB_PORT: ${OMB_PORT:-8799}
      OMB_WEBHOOK_PORT: ${OMB_WEBHOOK_PORT:-8800}
      OMB_PUBLIC_URL: ${OMB_PUBLIC_URL:-http://localhost:8080}
      OMB_WEBHOOK_PUBLIC_URL: ${OMB_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$OMB_PORT/api/health | grep -q openmausbot']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      OMB_HTTP_PORT: ${OMB_HTTP_PORT:-8080}
      OMB_PORT: ${OMB_PORT:-8799}
      OMB_WEBHOOK_PORT: ${OMB_WEBHOOK_PORT:-8800}
      OMB_HTTPS_HOST: ${OMB_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
