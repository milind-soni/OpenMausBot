name: ${COMPOSE_PROJECT_NAME:-astra-podman}
services:
  omb:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/astra-podman:${ASTRA_IMAGE_TAG:-local}
    init: true
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${ASTRA_DATA_ROOT:?Run setup.sh first}:${ASTRA_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/omb-podman.sock
    environment:
      HOME: ${ASTRA_DATA_ROOT}
      ASTRA_DATA_DIR: ${ASTRA_DATA_ROOT}/.astra
      ASTRA_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/omb-podman.sock
      ASTRA_PORT: ${ASTRA_PORT:-8799}
      ASTRA_WEBHOOK_PORT: ${ASTRA_WEBHOOK_PORT:-8800}
      ASTRA_PUBLIC_URL: ${ASTRA_PUBLIC_URL:-http://localhost:8080}
      ASTRA_WEBHOOK_PUBLIC_URL: ${ASTRA_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$ASTRA_PORT/api/health | grep -q astra']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      omb:
        condition: service_healthy
    environment:
      ASTRA_HTTP_PORT: ${ASTRA_HTTP_PORT:-8080}
      ASTRA_PORT: ${ASTRA_PORT:-8799}
      ASTRA_WEBHOOK_PORT: ${ASTRA_WEBHOOK_PORT:-8800}
      ASTRA_HTTPS_HOST: ${ASTRA_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
