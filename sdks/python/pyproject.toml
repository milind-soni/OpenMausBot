[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mausbot"
version = "0.1.0"
description = "Talk to a MausBot bot from your own code, through its Bot API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mausbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
