name: ${COMPOSE_PROJECT_NAME:-astra}
services:
  omb:
    init: true
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${ASTRA_BASE_IMAGE:-ghcr.io/milind-soni/astra:latest}
        ENGINES: ${ENGINES-@anthropic-ai/claude-code @openai/codex}
    image: ${ASTRA_LOCAL_IMAGE:-astra-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${ASTRA_BIND_ADDRESS:-127.0.0.1}:${ASTRA_HTTP_PORT:-8080}:80"
    environment:
      ASTRA_PORT: "8799"
      ASTRA_WEBHOOK_PORT: "8800"
      ASTRA_PUBLIC_URL: ${ASTRA_PUBLIC_URL:-http://localhost:${ASTRA_HTTP_PORT:-8080}}
      ASTRA_WEBHOOK_PUBLIC_URL: ${ASTRA_WEBHOOK_PUBLIC_URL:-${ASTRA_PUBLIC_URL:-http://localhost:${ASTRA_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('astra')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:omb
    environment:
      ASTRA_HTTPS_HOST: ${ASTRA_HTTPS_HOST:-}
      ASTRA_BIND_ADDRESS: ${ASTRA_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export ASTRA_UPSTREAM_SCHEME=http
        if [ -n "$$ASTRA_HTTPS_HOST" ] && [ "$$ASTRA_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "ASTRA_HTTPS_HOST requires ASTRA_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$ASTRA_HTTPS_HOST" ]; then
          export ASTRA_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      omb:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${ASTRA_DATA_EXTERNAL:-false}
    name: ${ASTRA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-astra}_data}
  caddy_data:
  caddy_config:
