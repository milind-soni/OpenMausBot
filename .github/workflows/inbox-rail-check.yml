name: Inbox rail check (real build)
on:
  workflow_dispatch:
  push:
    branches: [ci/inbox-rail-check]
permissions:
  contents: read
jobs:
  rail:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: app
        with:
          path: release/mac-arm64
          key: rail-app-${{ hashFiles('electron/**', 'src/**', 'server/**', 'shared/**', 'skills/**', 'package.json', 'pnpm-lock.yaml', 'electron-builder.yml') }}
      - name: Build what the release build builds
        if: steps.app.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm package:prepare && pnpm build:speech && pnpm build:cua
      - name: Package this runner's architecture, ad-hoc signed
        if: steps.app.outputs.cache-hit != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac dir --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.app.outputs.cache-hit != 'true'
        with:
          path: release/mac-arm64
          key: ${{ steps.app.outputs.cache-primary-key }}
      - name: Keep the updater out of the check
        run: rm -f release/mac-arm64/OpenMausBot.app/Contents/Resources/app-update.yml
      - name: Rail check against the packaged app
        run: node scripts/verify-place-inbox-rail.mjs --app release/mac-arm64/OpenMausBot.app --out "$RUNNER_TEMP/rail-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rail-evidence
          path: ${{ runner.temp }}/rail-evidence
          if-no-files-found: warn
