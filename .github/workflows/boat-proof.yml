# Temporary, never merged: ci.yml static job, forced onto Boat while BOAT_CI is off, to prove the Linux lanes.
name: Boat proof
on:
  push:
    branches:
      - ci/boat-proof
permissions:
  contents: read
jobs:
  static:
    name: Linux on one Boat VM (proof)
    runs-on: ${{ format('{0}{1}', 'bo', 'at-xlarge') }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          OMB_CI_LINUX_IN_STATIC: ${{ runner.environment == 'self-hosted' }}
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify CI selection and documentation references
        run: pnpm exec vitest run scripts/ci-scope.test.ts scripts/ci-linux-lanes.test.ts scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm lint
      - if: steps.scope.outputs.build == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.build == 'true'
        run: pnpm check:electron
      - name: production UI build
        if: steps.scope.outputs.build == 'true'
        run: pnpm exec vite build
      - name: Remove what Boat installs and GitHub's runners lack
        if: steps.scope.outputs.linux_lanes
        run: sudo rm -f /usr/bin/bwrap /usr/local/bin/{agent,claude,codex,cua-driver,cursor-agent,hermes,hermes-acp,hermes-agent,kimi,openclaw,opencode,pi,prime-agent,vibe,vibe-acp}
      - name: Prepare Electron test runtime
        if: steps.scope.outputs.linux_lanes
        run: node --input-type=commonjs -e "require('electron')"
      - name: Linux tests (vitest shards, behavior evals, packaged server), side by side
        if: steps.scope.outputs.linux_lanes
        env:
          OMB_CI_LINUX_LANES: ${{ steps.scope.outputs.linux_lanes }}
          OMB_CI_ISOLATE_LANES: "1"
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: UTC
        shell: setpriv --inh-caps=-all --ambient-caps=-all -- env -u DISPLAY -u XAUTHORITY bash --noprofile --norc -eo pipefail {0}
        run: sudo -n -E env "PATH=$PATH" node scripts/ci-linux-lanes.mjs
      - name: Report flaky tests that needed a retry
        if: ${{ !cancelled() && steps.scope.outputs.linux_lanes }}
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure() && steps.scope.outputs.linux_lanes
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7
