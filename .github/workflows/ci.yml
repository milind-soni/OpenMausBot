# Boat (https://docs.boat.dev/ci): while the repository variable BOAT_CI is "on", a run from this repository's own
# branches (a push to main, a pull request, a merge group) that the repository owner both authored and started does its
# Linux work on one 16 vCPU Boat VM, one Boat start per run: the static job runs on boat-xlarge and, after its checks,
# runs the Linux vitest shards, behavior evals and the Linux packaged server smoke side by side
# (scripts/ci-linux-lanes.mjs) instead of as GitHub-hosted jobs. Boat runs a public repository's job only for the users
# on its allow-list (`boat ci public`) and fails any other at once, so every other run, a fork's, the nightly and manual
# runs (the release lane among them), and every run while BOAT_CI is anything else run on GitHub's runners exactly as
# before. `boat ci` and the dashboard's CI on Boat VMs tab list the Boat jobs (docs/ci.md).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs CI on the PR merged onto the current main BEFORE it
  # lands, so a PR that is green alone but red together with what just
  # merged is stopped in the queue instead of on main (that shape reddened
  # main twice in Sep 2026). Turning the queue on is a branch-ruleset
  # setting, which GitHub offers only once an organization owns the
  # repository (docs/ci.md); this trigger is what lets CI report on those runs.
  merge_group:
  # The full lane every night on main's newest commit: every platform's shards
  # and smokes, which pushes to main and merge groups leave out (docs/ci.md).
  schedule:
    - cron: "17 21 * * *"

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  # A new PR push supersedes that PR's older checks. Main's pushes keep one run
  # going and one waiting: each merge replaces the waiting run, so a burst of
  # merges costs two runs, not one per merge (fifteen queued behind each other
  # in October 2026). The running one always finishes. Every other run has a
  # group no push can join: a merge group its own ref, the nightly run and each
  # manual run (the release branch's, and the release-ci/v<version> lane that
  # scripts/release-ci.mjs starts) their event and branch. A PR's group is
  # named by its number, never by github.ref: a merged PR's closed event
  # reports the base branch as github.ref, so a ref-named group let every merge
  # cancel main's run (ci-stop-closed.yml).
  group: ci-${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The test leg, in pieces ──────────────────────────────────────────────
  # Platform-independent checks run once, the suite runs in shards per
  # platform, and every smoke reports on its own. One final `CI` check
  # aggregates the required jobs (see docs/ci.md for ruleset migration).
  static:
    name: >-
      ${{ vars.BOAT_CI == 'on' && contains(fromJSON('["push", "pull_request", "merge_group"]'), github.event_name)
      && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == github.repository_owner)
      && 'typecheck + lint + Linux tests (Boat)' || 'typecheck + lint' }}
    runs-on: >-
      ${{ vars.BOAT_CI == 'on' && contains(fromJSON('["push", "pull_request", "merge_group"]'), github.event_name)
      && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == github.repository_owner)
      && 'boat-xlarge' || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.BOAT_CI == 'on' && 45 || 15 }}
    permissions:
      contents: read
      # ci-scope reads whether the commit before a push got its own green run,
      # and whether the pushed commit already passed the merge queue
      actions: read
      # and a pull request's labels as they are when the run starts
      pull-requests: read
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      vitest_os: ${{ steps.scope.outputs.vitest_os }}
      vitest_matrix: ${{ steps.scope.outputs.vitest_matrix }}
      packaged_server_os: ${{ steps.scope.outputs.packaged_server_os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history lets PR selection use the merge base, including deletes
          # and both sides of renames, without GitHub's changed-file page limit.
          # Its trees are enough for that; git fetches an old file's contents
          # when one is read. The whole history took 2m41s to reach a Boat VM.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Select checks for this change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          OMB_CI_LINUX_IN_STATIC: ${{ runner.environment == 'self-hosted' }}
        run: node scripts/ci-scope.mjs
      - run: pnpm install --frozen-lockfile
      - name: Verify CI selection and documentation references
        run: pnpm exec vitest run scripts/ci-scope.test.ts scripts/ci-linux-lanes.test.ts scripts/ci-workflow.test.ts scripts/testing/verification-docs.test.ts
      - name: Validate locale catalogs
        run: pnpm i18n:check
      - run: pnpm lint
      # A pull request that changes only docs, tests under scripts/ or the
      # control plane cannot change what these three check.
      - if: steps.scope.outputs.build == 'true'
        run: pnpm typecheck
      - if: steps.scope.outputs.build == 'true'
        run: pnpm check:electron
      - name: production UI build
        if: steps.scope.outputs.build == 'true'
        run: pnpm exec vite build
      # The rest runs only on a Boat VM, where ci-scope moved the Linux jobs' work into this job.
      - name: Remove what Boat installs and GitHub's runners lack
        if: steps.scope.outputs.linux_lanes
        # The server starts an engine it finds on PATH: Boat's Hermes then downloads its own Python, Node and tools
        # into each test's home, about nine seconds for every test that adds a bot. A Team Cloud runs its turns in a
        # bubblewrap box wherever bwrap works: here, once the step below drops the capability bwrap refuses to start
        # with, and never on a GitHub runner.
        run: sudo rm -f /usr/bin/bwrap /usr/local/bin/{agent,claude,codex,cua-driver,cursor-agent,hermes,hermes-acp,hermes-agent,kimi,openclaw,opencode,pi,prime-agent,vibe,vibe-acp}
      - name: Prepare Electron test runtime
        if: steps.scope.outputs.linux_lanes
        run: node --input-type=commonjs -e "require('electron')"
      - name: Linux tests (vitest shards, behavior evals, packaged server), side by side
        if: steps.scope.outputs.linux_lanes
        env:
          OMB_CI_LINUX_LANES: ${{ steps.scope.outputs.linux_lanes }}
          # Boat's image sets en_US.UTF-8, whose collation is Intl's default; GitHub's runners use C.UTF-8 and UTC.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: UTC
        # Boat's runner gives every process cap_dac_read_search as an ambient capability, so a test can still read a
        # file it set to mode 000, and Boat's desktop sets DISPLAY. GitHub's runners have neither.
        shell: setpriv --inh-caps=-all --ambient-caps=-all -- env -u DISPLAY -u XAUTHORITY bash --noprofile --norc -eo pipefail {0}
        run: node scripts/ci-linux-lanes.mjs
      - name: Report flaky tests that needed a retry
        if: ${{ !cancelled() && steps.scope.outputs.linux_lanes }}
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.scope.outputs.linux_lanes
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7

  vitest:
    # Admit the expensive runner fan-out only after the quick checks pass.
    # A failing preflight still fails the required gates; nothing is waived.
    needs: static
    if: contains(needs.static.outputs.jobs, '"vitest"')
    # scripts/ci-scope.mjs picks the platforms and their shards: PRs run Linux,
    # and Windows only when their change can break Windows or they carry the
    # windows label (the account runs only five macOS jobs at a time), main
    # pushes and merge groups Linux and Windows, and the full lane (nightly,
    # manual runs, the release lane) all three. A pull request that
    # cannot affect a platform's results leaves it out, and one that changes
    # only translations runs the locale tests alone. On a Boat VM the static
    # job runs the Linux entries itself. Linux runs every file;
    # Windows and macOS run every file but the e2e files that test only OMB's
    # own logic (OMB_VITEST_E2E=host, scripts/testing/host-e2e.ts). The split
    # is deterministic, so a failure names the same shard on every run, and
    # the same --shard and OMB_VITEST_E2E reproduce it locally.
    name: vitest (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.static.outputs.vitest_matrix) }}
    runs-on: ${{ matrix.os }}
    # scripts/testing/duration-sequencer.ts splits each platform's files by
    # their recorded seconds on that platform, about 17 minutes a Linux shard
    # and 10 to 15 a Windows one. The cap catches a hang, not normal suite
    # growth; Windows runners are about 1.45x slower and vary more.
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 25 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        # Electron lazily downloads its runtime on first import. Resolve it
        # before Vitest starts so a cold download cannot consume the fixture
        # timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - name: Run tests
        # The github-actions reporter turns each failure into an annotation
        # on the PR, so the failing test and its assertion are readable
        # without opening the job log.
        env:
          # scripts/testing/ci-retry-runner.ts records each listed flaky test
          # that needed a retry here (the runner context is step-level only).
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
          OMB_VITEST_E2E: ${{ matrix.e2e }}
          OMB_VITEST_SUBSET: ${{ matrix.files }}
        run: pnpm exec vitest run ${{ matrix.files }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=default --reporter=github-actions
      - name: Report flaky tests that needed a retry
        # Known flakes (scripts/testing/ci-retry-list.json) get two retries in
        # CI. A pass after a retry is still listed in the job summary, so the
        # flake stays visible until its entry is fixed and removed.
        if: ${{ !cancelled() }}
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Broker and Electron unit tests
        if: matrix.node_tests
        # About half a minute; node --test has no overall deadline, so a file
        # that never exits would otherwise hold the job to its cap.
        timeout-minutes: 5
        run: pnpm broker:test && pnpm test:electron

  behavior-evals:
    needs: static
    if: contains(needs.static.outputs.jobs, '"behavior-evals"')
    # The offline behavior-eval tiers (#1503): the evals' own vitest gate
    # (redaction, trace, golden replay), the tier-1 scenario runner, and the
    # tier-2 golden replay through the same entrypoint developers use. Tier
    # 3's live models stay opt-in: CI never sets OMB_EVAL_LIVE or any live
    # env, and the last step proves the offline gate holds by asserting the
    # skip line is what CI gets.
    name: behavior evals (offline tiers 1-3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval suite typecheck (standalone tsconfig)
        # The root typecheck builds src and server only; evals carries its
        # own tsconfig, so its type gate runs here with the rest of the
        # eval surfaces.
        run: pnpm exec tsc -p evals/tsconfig.json
      - name: Eval vitest gate (redaction, trace, golden replay)
        # Same reporter pair as the vitest shards, so a failure annotates
        # the PR with the failing test and assertion.
        run: pnpm exec vitest run --config evals/vitest.config.ts --reporter=default --reporter=github-actions
      - name: Tier 1 scenarios (scripted harness, no models)
        run: pnpm eval
      - name: Tier 2 golden replay against committed baselines
        run: pnpm eval --golden
      - name: Tier 3 stays offline in CI (the skip is the pass condition)
        run: |
          output="$(pnpm eval --live 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q "live tier skipped"
      - name: Upload eval run reports on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: behavior-evals-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/reports/runs/
          if-no-files-found: warn
          retention-days: 7

  packaged-server:
    needs: static
    if: contains(needs.static.outputs.jobs, '"packaged-server"')
    # `pnpm build:server`, then the bundle is copied out of the repo and run
    # with no node_modules in reach: every bare import must be inlined. The
    # macOS copy runs inside the macOS smokes job, so it takes no extra
    # macOS runner. The Windows copy runs where the Windows shards do.
    name: packaged server smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.packaged_server_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packaged-server

  windows-cua:
    needs: static
    if: contains(needs.static.outputs.jobs, '"windows-cua"')
    name: Windows CUA host smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Smoke the staged Windows CUA host (no computer actions)
        timeout-minutes: 5
        run: pnpm build:cua:win && pnpm smoke:cua-win
      - name: Lend this PC's apps and screen as the installed app does (reads only, no input)
        timeout-minutes: 5
        run: pnpm smoke:cua-win-lend

  electron-smokes:
    needs: static
    if: contains(needs.static.outputs.jobs, '"electron-smokes"')
    # Real Electron utility processes against disposable homes and fake CLIs.
    # Never the live app. Each script prints its own evidence lines. Every
    # PR's, push's and merge group's macOS checks live in this one job: macOS
    # runners are the scarce ones, and each extra job pays its own queue wait
    # and install.
    name: macOS smokes (packaged server + Electron)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - name: Packaged server smoke (macOS)
        # Builds dist-server/ and runs a copy of it outside the repo; the
        # phone-relay smoke below forks the same dist-server/index.js.
        run: pnpm test:packaged-server
      - name: Verify native approval mode transitions
        run: pnpm exec electron scripts/smoke-approval-modes.cjs
      - name: Verify app permissions and guarded display capture
        run: node scripts/smoke-app-permissions.mjs
      - name: Verify chat app frames stay sealed
        run: node scripts/smoke-app-frames.mjs --engagement
      - name: Verify paired phone authorization against packaged harness
        # Forks dist-server/index.js, built by the packaged server step.
        run: pnpm build:companion && pnpm exec electron scripts/smoke-phone-relay-auth.cjs
      - name: Verify Send to My Cloud's login handoff over the real utility port
        # Forks dist-server/index.js, built by the packaged server step.
        run: pnpm exec electron scripts/smoke-login-handoff.cjs

  gate:
    # One aggregation, not three queued runners doing the same check.
    name: CI
    needs: [static, vitest, behavior-evals, packaged-server, windows-cua, electron-smokes]
    # Still report failed/skipped dependencies, but don't keep a superseded
    # workflow alive just to schedule its summary jobs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const needs = JSON.parse(process.env.NEEDS);
            const rows = Object.entries(needs).map(([job, { result }]) => `${result.padEnd(9)} ${job}`);
            console.log(rows.join("\n"));
            let selected;
            try { selected = JSON.parse(needs.static.outputs.jobs); } catch { selected = null; }
            if (!Array.isArray(selected) || !selected.every((job) => typeof job === "string")) throw new Error("Missing CI selection");
            const bad = Object.entries(needs).filter(([job, { result }]) => {
              const expected = job === "static" || selected.includes(job) ? "success" : "skipped";
              return result !== expected;
            });
            if (bad.length) { console.error(`\n${bad.length} required job(s) did not pass: ${bad.map(([job]) => job).join(", ")}`); process.exit(1); }
          '

  cloudflared-linux-arm64:
    needs: static
    if: contains(needs.static.outputs.jobs, '"cloudflared-linux-arm64"')
    name: cloudflared installer (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install and reuse the pinned connector in an isolated fixture
        env:
          OMB_ARM64_FIXTURE: ${{ runner.temp }}/omb-cloudflared-arm64
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "linux"); assert.equal(process.arch, "arm64");'
          node scripts/prepare-cloudflared.mjs --current --root "$OMB_ARM64_FIXTURE"
          node scripts/prepare-cloudflared.mjs --current --root "$OMB_ARM64_FIXTURE"
          "$OMB_ARM64_FIXTURE/dist-native/cloudflared/linux-arm64/cloudflared" version

  foss:
    needs: static
    if: contains(needs.static.outputs.jobs, '"foss"')
    # LICENSING.md promises that deleting enterprise/ leaves a working
    # open-source edition. Prove it on runtime changes: typecheck, the edition
    # tests, and a boot that reports "oss" even with a key set.
    name: open-source edition builds without enterprise/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the enterprise folder
        run: rm -rf enterprise
      - run: pnpm typecheck
      - run: pnpm exec vitest run server/enterprise.test.ts server/brand.test.ts
      - name: The server boots and reports the open-source edition
        run: |
          mkdir -p /tmp/omb-foss/home
          HOME=/tmp/omb-foss/home OMB_DATA_DIR=/tmp/omb-foss/data OMB_PORT=18797 OMB_WEBHOOK_PORT=18796 \
            OMB_BROWSER_CONNECTION=/tmp/omb-foss/browser-connection.json OMB_LICENSE_KEY=omb1.not.real \
            node --experimental-strip-types server/index.ts > /tmp/omb-foss/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:18797/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18797/api/edition | tee /tmp/omb-foss/edition.json; echo
          grep -q '"edition":"oss"' /tmp/omb-foss/edition.json
          grep -q 'no enterprise layer exists' /tmp/omb-foss/edition.json
          kill %1; wait %1 || true

  control-plane:
    needs: static
    if: contains(needs.static.outputs.jobs, '"control-plane"')
    name: control-plane check + workerd tests + dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm control-plane:check
      - run: pnpm control-plane:test
      - run: pnpm control-plane:dry-run

  deploy-composio-broker:
    # Only deploys on push to upstream main. PRs run the control-plane tests
    # but do not deploy: the wiring is exercised end-to-end only by a merged
    # commit, so an unreviewed branch can never push to production. Closes
    # the deploy gap that left #1914's broker fix (45cc2cf) sitting in
    # source without reaching Cloudflare.
    needs: [control-plane]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: deploy composio broker (Cloudflare Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A repo without the secret (a fork, or before the token is created)
      # skips the deploy with a warning instead of failing every main push.
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Composio broker not deployed::CLOUDFLARE_API_TOKEN is not set, so the broker Worker was not deployed."
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: pnpm broker:check
      - if: steps.token.outputs.present == 'true'
        run: pnpm broker:test
      - name: Deploy the composio broker Worker via Wrangler
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Mirrors the local `pnpm broker:deploy` script so CI is the same
          # command a developer runs by hand. The token is created in the
          # Cloudflare dashboard with Workers Scripts:Edit on the broker
          # account; store it as the CLOUDFLARE_API_TOKEN repo secret.
          command: deploy --config cloudflare/composio-broker/wrangler.jsonc

  ui-smoke:
    needs: static
    if: contains(needs.static.outputs.jobs, '"ui-smoke"')
    # Advisory, outside the required `test` matrix: the renderer recipe in
    # docs/verification/chat-ui.md run by a machine. It downloads the pinned
    # agent-browser release (digest verified) and its Chrome, drives the real
    # <App/> against the isolated fake-engine fixture, and keeps the screenshot.
    name: renderer smoke (control-omb ui, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        # Ubuntu 24.04's AppArmor profile blocks unprivileged user namespaces,
        # so the downloaded Chrome for Testing dies with "No usable sandbox".
        # This is Chrome's own documented fix for 23.10+; a developer machine
        # needs nothing, and the sandbox itself stays on.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive the real renderer through control-omb ui
        env:
          OMB_UI_E2E: "1"
          OMB_UI_EVIDENCE_DIR: .omb-scratch/verify-evidence
        run: pnpm exec vitest run scripts/testing/control-omb-ui.e2e.test.ts scripts/testing/bot-tools-ui.e2e.test.ts scripts/testing/thinking-timer-ui.e2e.test.ts scripts/testing/team-share-ui.e2e.test.ts scripts/testing/org-library-ui.e2e.test.ts scripts/testing/presets-ui.e2e.test.ts scripts/testing/browser-evidence.e2e.test.ts scripts/testing/browser-fill.e2e.test.ts scripts/testing/rich-table-composer-ui.e2e.test.ts scripts/testing/computer-panel-focus-ui.e2e.test.ts scripts/testing/mobile-code-blocks-ui.e2e.test.ts
      - name: Upload the renderer screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-omb-ui-chat-screenshot
          path: |
            .omb-scratch/verify-evidence/chat-ui.png
            .omb-scratch/verify-evidence/thinking-timer-anchored.png
            .omb-scratch/verify-evidence/share-team-dialog.png
            .omb-scratch/verify-evidence/mobile-code-blocks/
          if-no-files-found: warn
          retention-days: 7

  browser-identity:
    needs: static
    if: contains(needs.static.outputs.jobs, '"browser-identity"')
    # Advisory, outside the required gate: the pinned agent-browser drives a
    # real Chrome for Testing through OMB's launcher and identity connection
    # (scripts/testing/browser-identity.e2e.test.ts): a 1280x720 page whose
    # user agent and client hints are the browser's own in the page, a
    # worker, a service worker and a cross-site frame. On Windows this is
    # also the check that the 0.36.0-omb.1 engine starts Chrome through the
    # generated batch file. browser-passkey.e2e.test.ts: a passkey step's
    # request ends at once there, so Try another way works. The same
    # platforms as the vitest matrix.
    name: browser identity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Drive a real Chrome through the launcher
        env:
          OMB_UI_E2E: "1"
        # One file at a time: a runner's first Chrome launch is slow (on Windows it waits for a scan of the binary), and two
        # at once ran the identity probe past its 30 s.
        run: pnpm exec vitest run scripts/testing/browser-identity.e2e.test.ts scripts/testing/browser-passkey.e2e.test.ts --no-file-parallelism

  package-linux:
    needs: static
    if: contains(needs.static.outputs.jobs, '"package-linux"')
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - name: Package from the verified offline CUA stage
        run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Verify the installed browser with Ubuntu sandbox restrictions
        run: node scripts/smoke-browser-bundle.mjs --resources /opt/OpenMausBot/resources
      - name: Launch packaged app and verify lifecycle
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Upload smoke diagnostics on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: openmausbot-ubuntu-smoke-diagnostics
          path: |
            /tmp/omb-linux-smoke-*
            /tmp/omb-linux-smoke-runtime-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  browser-driver:
    needs: static
    if: contains(needs.static.outputs.jobs, '"browser-driver"')
    # Advisory, outside the CI gate until it has run green for a while: the
    # omb-cdp S4 conformance suites and the new browser's checklist and viewer
    # suites on the runner's own Google Chrome (PRs run Linux, and Windows
    # where the vitest shards do; the full lane all three; pushes to main and
    # merge groups leave it out), then on Linux inside the server image's
    # runtime as a non-root user. Every S4 suite also fails when its trace holds Runtime.enable or
    # another forbidden CDP method (docs/ci.md).
    name: browser driver S4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.vitest_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Let Chrome build its sandbox on this runner, and give it a display
        # Ubuntu 24.04 restricts unprivileged user namespaces; Chrome's own
        # documented fix for 23.10+. The sandbox itself stays on.
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Keep the runner's Google Chrome as it is for the whole run
        # The macOS image's Chrome is older than Google's release, and about
        # 30 s after Chrome first runs it starts its bundled GoogleUpdater,
        # which swaps the new version into the app a minute later (155.0.8059.40
        # to .85 in October 2026): a launch inside the swap fails at once, and
        # a profile the new version opened is refused by the identity read
        # from the old one. The locked bundle keeps the binary under test fixed.
        if: runner.os == 'macOS'
        run: |
          chflags -R uchg "/Applications/Google Chrome.app"
          defaults read "/Applications/Google Chrome.app/Contents/Info.plist" CFBundleShortVersionString | tee "$RUNNER_TEMP/chrome-version"
      - name: S4 on the runner's Google Chrome
        # The headed-identity case needs a display, which Linux runners get from Xvfb.
        env:
          OMB_CDP_E2E: "1"
        shell: bash
        run: |
          run=(pnpm exec vitest run server/browser/cdp/s4- server/browser/checklist.e2e server/browser/passkey-wall.e2e server/browser/viewers/viewers.e2e server/browser/viewers/stream-v2.e2e --reporter=verbose --silent=false --reporter=github-actions)
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "${run[@]}"; else "${run[@]}"; fi
      - name: The runner's Google Chrome did not change during the run
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: test "$(defaults read "/Applications/Google Chrome.app/Contents/Info.plist" CFBundleShortVersionString)" = "$(cat "$RUNNER_TEMP/chrome-version")"
      - name: S4 inside the server image's runtime, as its own user
        # maus, with its real home, as the server runs there. The image's
        # Chrome for Testing has no setuid sandbox helper yet, so this leg
        # runs with the operator opt-out; the host legs keep the sandbox.
        # Vitest writes its bundled config beside it and its cache under
        # node_modules/.vite, so those two places are opened to maus. It runs
        # even when the host leg failed: they test different Chromes.
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          docker build --target runtime -t omb-runtime:s4 .
          mkdir -p node_modules/.vite && chmod a+w . node_modules/.vite
          docker run --rm --init --shm-size=512m --user maus -e CI=true \
            -e OMB_CDP_CHROME=/opt/openmausbot-browser/chrome -e OMB_CDP_HOST=container -e OMB_BROWSER_SANDBOX=0 \
            -v "$PWD:/src" -w /src omb-runtime:s4 \
            node node_modules/vitest/vitest.mjs run server/browser/cdp/s4- server/browser/checklist.e2e server/browser/passkey-wall.e2e server/browser/viewers/viewers.e2e server/browser/viewers/stream-v2.e2e --reporter=verbose --silent=false
