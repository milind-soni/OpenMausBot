# One-button releases: builds macOS (arm64 + x64, signed, notarized, stapled),
# Windows, and Ubuntu from ONE commit, assembles a complete draft in this
# repository with verified feeds, and mirrors it to the legacy releases repo
# so already-installed builds can cross the updater migration safely.
#
# Every gate below exists because its absence shipped (or nearly shipped) a
# broken build from a laptop:
#   - clean output dirs        -> 0.1.15 "app is damaged" (stale dist/ broke the seal)
#   - codesign gate BEFORE     -> notarization ACCEPTS invalid signatures
#   - packaged-server smoke    -> 0.1.24 died on launch (unbundled zod import)
#   - proxy-path probe         -> the 0.1.24 fix broke every helper while
#                                 /api/health stayed green
#   - staple, THEN hash        -> stapling rewrites bytes; stale feeds make
#                                 electron-updater reject every update
#   - blockmap regeneration    -> stale differential maps waste every updater's
#                                 bandwidth silently
#   - assemble-then-publish    -> 0.1.24 sat as an invisible draft; a mac-only
#                                 publish 404s the README's other buttons
#
# One-time setup (repo secrets) is documented in docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish immediately after assembly (otherwise leave a draft for review)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      should_release: ${{ steps.pin.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: pin
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          current=$(node -p "require('./package.json').version")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          should_release=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git cat-file -e "$BEFORE:package.json" 2>/dev/null || {
              echo "::error::cannot verify the version before this push; refusing to start a release"
              exit 1
            }
            previous=$(git show "$BEFORE:package.json" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => console.log(JSON.parse(s).version))')
            if [ "$previous" = "$current" ]; then
              echo "package.json changed without a version bump; skipping the release"
              should_release=false
            fi
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published canonical release
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on $GITHUB_REPOSITORY — bump the version first"
            exit 1
          fi
      - name: Refuse to overwrite a published legacy mirror
        if: steps.pin.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::RELEASES_PAT is required for the updater bridge"; exit 1; }
          v="v$(node -p "require('./package.json').version")"
          if gh release view "$v" --repo milind-soni/openmausbot-releases --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$v is already published on the legacy mirror — recover the canonical draft instead of rebuilding bytes"
            exit 1
          fi

  mac:
    name: macOS arm64 + x64 (sign, notarize, staple)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures
        run: pnpm package:mac

      - name: "Gate: both packaged apps use the canonical updater feed"
        run: |
          for app in release/mac-arm64/OpenMausBot.app release/mac/OpenMausBot.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^owner: milind-soni$' "$update" || { echo "::error::wrong update owner in $update"; exit 1; }
            grep -Eq '^repo: OpenMausBot$' "$update" || { echo "::error::wrong update repo in $update"; exit 1; }
          done

      - name: "Gate: the signature must verify BEFORE notarization"
        run: |
          for app in release/mac-arm64/OpenMausBot.app release/mac/OpenMausBot.app; do
            codesign --verify --deep --strict "$app"
            bin="$app/Contents/Resources/cloudflared/cloudflared"
            test -x "$bin" || { echo "::error::missing executable $bin"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-LICENSE.txt" \
              || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -f "$app/Contents/Resources/licenses/cloudflared-README.md" \
              || { echo "::error::missing cloudflared provenance in $app"; exit 1; }
            codesign --verify --strict "$bin"
            app_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            bin_team=$(codesign -dv --verbose=4 "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$app_team" && test "$bin_team" = "$app_team" || {
              echo "::error::cloudflared is not signed by the app's Developer ID team in $app"; exit 1; }
            echo "ok: $app"
          done

      - name: "Gate: both packaged servers start and every helper path resolves"
        run: |
          for app in release/mac-arm64/OpenMausBot.app release/mac/OpenMausBot.app; do
            res="$app/Contents/Resources"
            # the server tree is plain JS — runnable on the runner's node
            # regardless of the app binary's arch
            OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node --input-type=module - "$res/server" <<'EOF'
          import { existsSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const server = process.argv[2];
          const { SPAWNED_PROXIES } = await import(pathToFileURL(`${server}/proxy-paths.js`));
          const missing = Object.entries(SPAWNED_PROXIES).filter(([, p]) => !existsSync(p));
          if (missing.length) {
            console.error("unresolved proxies:", missing);
            process.exit(1);
          }
          console.log(`ok: ${Object.keys(SPAWNED_PROXIES).length} proxies resolve in ${server}`);
          EOF
            for bin in "$res/cua-driver" "$res/OpenMausBot Speech.app/Contents/MacOS/speech-helper"; do
              lipo -archs "$bin" | grep -q "x86_64" || { echo "::error::$bin lacks x86_64"; exit 1; }
              lipo -archs "$bin" | grep -q "arm64" || { echo "::error::$bin lacks arm64"; exit 1; }
            done
            cloudflared="$res/cloudflared/cloudflared"
            expected_arch=x86_64
            case "$app" in *mac-arm64*) expected_arch=arm64 ;; esac
            test "$(lipo -archs "$cloudflared")" = "$expected_arch" || {
              echo "::error::$cloudflared is not the expected $expected_arch executable"; exit 1; }
            if [ "$(uname -m)" = "$expected_arch" ]; then
              "$cloudflared" version | grep -Fq "cloudflared version 2026.8.2 " || {
                echo "::error::$cloudflared has the wrong version"; exit 1; }
            fi
          done

      - name: Notarize all four artifacts
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple, re-zip, regenerate blockmaps and the feed
        run: |
          xcrun stapler staple release/OpenMausBot-*-arm64.dmg
          xcrun stapler staple release/OpenMausBot-*-x64.dmg
          xcrun stapler staple release/mac-arm64/OpenMausBot.app
          xcrun stapler staple release/mac/OpenMausBot.app
          v=$(node -p "require('./package.json').version")
          rm -f "release/OpenMausBot-$v-arm64.zip" "release/OpenMausBot-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/OpenMausBot.app "release/OpenMausBot-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/OpenMausBot.app "release/OpenMausBot-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/OpenMausBot-$v-arm64.zip" "release/OpenMausBot-$v-x64.zip" \
            "release/OpenMausBot-$v-arm64.dmg" "release/OpenMausBot-$v-x64.dmg"
          # refreshes every hash from the post-staple bytes and refuses to
          # finish unless the feed matches the files on disk
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies for the README's /latest/download links
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenMausBot-$v-arm64.dmg" release/OpenMausBot.dmg
          cp "release/OpenMausBot-$v-x64.dmg" release/OpenMausBot-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: Verify the packaged tree and start the packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/licenses/cloudflared-README.md" ] || { echo "::error::missing cloudflared provenance"; exit 1; }
          expected=c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5
          actual=$(sha256sum "$res/cloudflared/cloudflared.exe" | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::cloudflared hash is $actual"; exit 1; }
          "$res/cloudflared/cloudflared.exe" version | grep -Fq "cloudflared version 2026.8.2 " || {
            echo "::error::cloudflared has the wrong version"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -Eq '^owner: milind-soni$' "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: OpenMausBot$' "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenMausBot-$v-setup.exe" release/OpenMausBot-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: pnpm clean
      - name: Stage the pinned CUA runtime
        run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - run: pnpm package:linux
      - name: Verify the packaged updater target
        run: |
          update=release/linux-unpacked/resources/app-update.yml
          test -f "$update" || { echo "::error::missing $update"; exit 1; }
          grep -Eq '^owner: milind-soni$' "$update" || { echo "::error::wrong update owner"; exit 1; }
          grep -Eq '^repo: OpenMausBot$' "$update" || { echo "::error::wrong update repo"; exit 1; }
      - name: Verify package contents and metadata
        run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent on the ephemeral runner
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
          test "$(stat -c '%U:%G %a' /opt)" = "root:root 755"
      - name: Reproduce and verify an in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' release/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Smoke the packages
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - name: Remove the installed upgrade fixture
        if: always()
        run: sudo dpkg --purge openmausbot || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenMausBot-$v-amd64.deb" release/OpenMausBot-amd64.deb
          cp "release/OpenMausBot-$v-x86_64.AppImage" release/OpenMausBot.AppImage
          (cd release && sha256sum OpenMausBot-$v-amd64.deb OpenMausBot-$v-x86_64.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble the draft and verify every feed
    needs: [prepare, mac, windows, linux]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-mirror-v${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      # to dispatch the npm and Docker publishes on the new tag
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Refuse an incomplete installer or updater set
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          required=(
            latest-linux.yml latest-mac.yml latest.yml
            "OpenMausBot-$VERSION-amd64.deb"
            "OpenMausBot-$VERSION-arm64.dmg"
            "OpenMausBot-$VERSION-arm64.dmg.blockmap"
            "OpenMausBot-$VERSION-arm64.zip"
            "OpenMausBot-$VERSION-arm64.zip.blockmap"
            "OpenMausBot-$VERSION-setup.exe"
            "OpenMausBot-$VERSION-setup.exe.blockmap"
            "OpenMausBot-$VERSION-x64.dmg"
            "OpenMausBot-$VERSION-x64.dmg.blockmap"
            "OpenMausBot-$VERSION-x64.zip"
            "OpenMausBot-$VERSION-x64.zip.blockmap"
            "OpenMausBot-$VERSION-x86_64.AppImage"
            OpenMausBot-amd64.deb OpenMausBot-intel.dmg OpenMausBot-setup.exe
            OpenMausBot.AppImage OpenMausBot.dmg SHA256SUMS-ubuntu-x64.txt
          )
          for file in "${required[@]}"; do
            test -s "assets/$file" || { echo "::error::missing or empty release asset: $file"; exit 1; }
          done
          test "$(find assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#required[@]}" || {
            echo "::error::unexpected release asset set"; find assets -maxdepth 1 -type f -print; exit 1; }
      - name: Verify every feed hash against the actual bytes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          const expected = new Map([
            ["latest-mac.yml", [
              "OpenMausBot-${{ needs.prepare.outputs.version }}-x64.zip",
              "OpenMausBot-${{ needs.prepare.outputs.version }}-arm64.zip",
              "OpenMausBot-${{ needs.prepare.outputs.version }}-x64.dmg",
              "OpenMausBot-${{ needs.prepare.outputs.version }}-arm64.dmg",
            ]],
            ["latest.yml", ["OpenMausBot-${{ needs.prepare.outputs.version }}-setup.exe"]],
            ["latest-linux.yml", [
              "OpenMausBot-${{ needs.prepare.outputs.version }}-x86_64.AppImage",
              "OpenMausBot-${{ needs.prepare.outputs.version }}-amd64.deb",
            ]],
          ]);
          let bad = 0;
          for (const [feed, expectedUrls] of expected) {
            const text = readFileSync(feed, "utf8");
            const entries = [...text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)];
            const urls = entries.map(([, url]) => url).sort();
            if (JSON.stringify(urls) !== JSON.stringify([...expectedUrls].sort())) {
              console.error(`WRONG PATHS in ${feed}: ${urls.join(", ") || "none"}`);
              bad++;
              continue;
            }
            for (const [, url, hash, size] of entries) {
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`\nall feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the canonical draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --draft --title "OpenMausBot $VERSION" \
              --generate-notes
          else
            target=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
            test "$target_sha" = "$SHA" || {
              echo "::error::$tag draft targets $target_sha, not pinned release commit $SHA"
              exit 1
            }
          fi
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          # A rerun preserves human edits made while reviewing the canonical
          # draft, and mirrors that exact body into the compatibility release.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          echo "canonical asset count: $(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"

      - name: Mirror the same draft for installed legacy clients
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" --repo milind-soni/openmausbot-releases > /dev/null 2>&1; then
            gh release create "$tag" --repo milind-soni/openmausbot-releases \
              --draft --title "OpenMausBot $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$tag" --repo milind-soni/openmausbot-releases \
            --title "OpenMausBot $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          for file in assets/*; do
            gh release upload "$tag" "$file" --repo milind-soni/openmausbot-releases --clobber
          done
          echo "legacy asset count: $(gh release view "$tag" --repo milind-soni/openmausbot-releases --json assets --jq '.assets | length')"

      - name: Prove both drafts contain the exact staged bytes
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node --input-type=module - "$VERSION" <<'EOF'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const version = process.argv[2];
          const expected = new Map(readdirSync("assets").map((name) => [
            name,
            `sha256:${createHash("sha256").update(readFileSync(join("assets", name))).digest("hex")}`,
          ]));
          for (const [repo, token] of [
            [process.env.GITHUB_REPOSITORY, process.env.CANONICAL_TOKEN],
            ["milind-soni/openmausbot-releases", process.env.LEGACY_TOKEN],
          ]) {
            const json = execFileSync("gh", ["release", "view", `v${version}`, "--repo", repo, "--json", "assets"], {
              encoding: "utf8",
              env: { ...process.env, GH_TOKEN: token },
            });
            const assets = JSON.parse(json).assets;
            if (assets.length !== expected.size) throw new Error(`${repo}: expected ${expected.size} assets, got ${assets.length}`);
            for (const asset of assets) {
              if (expected.get(asset.name) !== asset.digest) throw new Error(`${repo}: digest mismatch for ${asset.name}`);
            }
            console.log(`ok: ${repo} has ${assets.length} byte-identical assets`);
          }
          EOF

      - name: Publish (only when asked to)
        if: ${{ inputs.publish }}
        env:
          CANONICAL_TOKEN: ${{ github.token }}
          LEGACY_TOKEN: ${{ secrets.RELEASES_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The bridge build points at the canonical feed. Publish and verify
          # that destination before making the build visible to legacy clients.
          GH_TOKEN="$CANONICAL_TOKEN" gh release edit "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
          GH_TOKEN="$CANONICAL_TOKEN" gh release view "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -q false
          GH_TOKEN="$LEGACY_TOKEN" gh release edit "v$VERSION" \
            --repo milind-soni/openmausbot-releases --draft=false --latest
          GH_TOKEN="$LEGACY_TOKEN" gh release view "v$VERSION" \
            --repo milind-soni/openmausbot-releases --json isDraft --jq .isDraft | grep -q false
          echo "v$VERSION is live on the canonical feed and its legacy updater bridge"
          # Publishing created the tag with this workflow's token, and GitHub
          # starts no workflow from events that token creates. Start the two
          # tag-driven publishes by hand, on the tag, so they see refs/tags/v*.
          for workflow in npm-package.yml docker.yml; do
            GH_TOKEN="$CANONICAL_TOKEN" gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "v$VERSION"
          done
          echo "dispatched the npm package and Docker image publishes on v$VERSION"
