name: Docker image

on:
  # release.yml dispatches this on the tag it just published: a tag created
  # with the workflow token never fires push events on its own.
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - server/**
      - src/**
      - enterprise/**
      - scripts/bundle-server.mjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build image + boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t openmausbot:ci .
      - name: Boot the container and prove the server + UI answer
        run: |
          set -euo pipefail
          docker run -d --name omb openmausbot:ci
          for i in $(seq 1 40); do
            if docker exec omb curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs omb; echo "server never became healthy"; exit 1; fi
          done
          # the renderer is served by the server itself (OMB_STATIC_DIR)
          docker exec omb curl -sf http://127.0.0.1:8799/ | grep -qi "<html" || { docker logs omb; echo "UI not served"; exit 1; }
          docker logs omb | tail -5
      - name: Prove the image finds its enterprise layer
        # The image ships dist-server/ alone, so the bundled layer sits inside
        # the server root (server/enterprise.ts looks there after the sibling
        # folder). A key that is not genuine proves the layer loaded and
        # checked it; a missing layer would report "no enterprise layer exists"
        # and a licensed self-hoster would silently run the open-source edition.
        run: |
          set -euo pipefail
          docker run -d --name omb-ent -e OMB_LICENSE_KEY=omb1.not.real openmausbot:ci
          for i in $(seq 1 40); do
            if docker exec omb-ent curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot; then break; fi
            sleep 2
            if [ "$i" = "40" ]; then docker logs omb-ent; echo "server never became healthy"; exit 1; fi
          done
          edition=$(docker exec omb-ent curl -sf http://127.0.0.1:8799/api/edition)
          echo "$edition"
          if grep -q 'no enterprise layer exists' <<<"$edition"; then echo "the image cannot find its enterprise layer"; exit 1; fi
          grep -q '"edition":"oss"' <<<"$edition"
          grep -q 'enterprise layer disabled: OMB_LICENSE_KEY signature does not match' <<<"$edition"
          docker exec omb-ent test -f /app/dist-server/enterprise/LICENSE
          docker rm -f omb-ent >/dev/null
      - name: Prove the non-root user can browse with the baked-in Chrome
        run: |
          set -euo pipefail
          test "$(docker exec omb id -un)" = maus
          timeout 45 docker exec omb agent-browser --session ci-browser open 'data:text/html,<title>OMB browser smoke</title><h1>Browser ready</h1>'
          timeout 15 docker exec omb agent-browser --session ci-browser get title | grep -Fx 'OMB browser smoke'
          # Chrome for Testing's page is 1280x577 until sized; the harness sizes
          # it to 1280x720 so pictures, boxes and clicks agree.
          timeout 15 docker exec omb agent-browser --session ci-browser set viewport 1280 720
          test "$(timeout 15 docker exec omb agent-browser --session ci-browser eval "innerWidth+'x'+innerHeight")" = '"1280x720"'
          # The harness reads and pictures a bot's browser over the engine's
          # loopback relay (server/browser-relay.ts); the daemon writes the file.
          port=$(timeout 15 docker exec omb agent-browser --session ci-browser stream status --json | jq -r .data.port)
          answer=$(docker exec omb curl -sf -X POST -H 'content-type: application/json' -H "origin: http://127.0.0.1:$port" \
            --data '{"action":"screenshot","path":"/tmp/relay.jpg","format":"jpeg","quality":70}' "http://127.0.0.1:$port/api/command")
          grep -q '"success":true' <<<"$answer"
          docker exec omb test -s /tmp/relay.jpg
          timeout 15 docker exec omb agent-browser --session ci-browser close
      - name: Prove the server never binds a public interface
        # The loopback-trust model is the auth model, so the image must keep
        # the server unreachable from the container's own network. Probe from a
        # sibling container on the same bridge; a positive control first proves
        # the probe can see a socket that does bind 0.0.0.0.
        run: |
          set -euo pipefail
          probe() { docker run --rm --network bridge curlimages/curl:8.14.1 -s --max-time 3 "http://$1:$2/" >/dev/null; }
          docker run -d --name leaky --entrypoint node openmausbot:ci -e "require('http').createServer((q,s)=>s.end('leak')).listen(8799,'0.0.0.0')"
          sleep 2
          leaky_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' leaky)
          test -n "$leaky_ip"
          probe "$leaky_ip" 8799 || { echo "probe cannot see a 0.0.0.0 listener; the check would be vacuous"; exit 1; }
          docker rm -f leaky >/dev/null
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' omb)
          test -n "$ip"
          if probe "$ip" 8799 || probe "$ip" 8800; then
            echo "server answered on $ip — it must only bind 127.0.0.1"; exit 1
          fi
          echo "unreachable on $ip: loopback-only holds"
      - name: Run the tenant stack (server + Caddy) and pair like a browser would
        # deploy/docker-compose.yml is the product here: through TLS, prove that
        # nothing but the descriptor and the UI shell is served before pairing,
        # that a code minted inside the container turns into a Secure cookie
        # session, that the cookie is same-origin only, that the event stream is
        # unbuffered, and that hooks stay reachable without a session.
        run: |
          set -euo pipefail
          docker rm -f omb >/dev/null
          docker tag openmausbot:ci ghcr.io/milind-soni/openmausbot:latest
          printf 'DOMAIN=localhost\nENGINES=\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --no-build
          for i in $(seq 1 45); do
            curl -sk -o /dev/null --max-time 2 https://localhost/.well-known/openmausbot/environment && break
            sleep 2
            if [ "$i" = "45" ]; then docker compose -f deploy/docker-compose.yml logs; echo "caddy never answered"; exit 1; fi
          done
          code() { curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "$@"; }
          body() { curl -sk --max-time 10 "$@"; }
          H=https://localhost
          grep -q '"environmentId"' <<<"$(body $H/.well-known/openmausbot/environment)"   # descriptor is public
          grep -q '^{"app":"openmausbot"}$' <<<"$(body $H/api/health)"             # the probe is public, and says only the app name
          test "$(code $H/api/bots)" = 403                                        # nothing else before pairing
          grep -q 'pair this device' <<<"$(body $H/api/bots)"
          grep -qi '<html' <<<"$(body $H/pair)"                                    # the UI shell is served so /pair can load
          test "$(code http://localhost/)" = 308                                   # HTTP redirects to HTTPS
          pairing=$(docker compose -f deploy/docker-compose.yml exec -T omb node dist-server/pair-cli.js --label ci)
          echo "$pairing"
          pcode=$(grep -o 'code=[A-Z2-9-]*' <<<"$pairing" | head -1 | cut -d= -f2)
          test -n "$pcode"
          jar=$(mktemp)
          paired=$(curl -sk --max-time 10 -c "$jar" -D - -X POST $H/api/auth/pair -H 'content-type: application/json' -d "{\"code\":\"$pcode\",\"cookie\":true}")
          grep -qi 'set-cookie: omb_session_' <<<"$paired"                        # cookie session
          grep -qi 'Secure' <<<"$paired"                                          # over TLS the cookie is Secure
          grep -qi 'HttpOnly' <<<"$paired"
          test "$(code -b "$jar" $H/api/health)" = 200                              # paired: the API answers
          grep -q openmausbot <<<"$(body -b "$jar" $H/api/health)"
          test "$(code -b "$jar" -H 'Origin: https://evil.example' -X POST -d '{}' $H/api/bots)" = 403   # cookie is same-origin only
          test "$(code -b "$jar" -H 'Origin: https://localhost' $H/api/auth/session)" = 200
          grep -q '"via":"cookie"' <<<"$(body -b "$jar" $H/api/auth/session)"
          grep -q '"label":"ci"' <<<"$(body -b "$jar" $H/api/auth/sessions)"        # listed for revocation
          grep -q error <<<"$(body -X POST $H/hooks/wh_nope)"                      # hook path reaches the receiver without a session
          # The event stream never ends, so curl's own --max-time exit (28) is expected;
          # the proof is that bytes arrived within the window (a buffering proxy sends none).
          sse=$( (curl -sk -b "$jar" -N --max-time 4 $H/api/events || true) | head -c 64 )
          test -n "$sse"                                                           # SSE streams, not buffered
          grep -q '"baseUrl":"https://localhost"' <<<"$(body -b "$jar" $H/api/webhooks)"   # OMB_WEBHOOK_PUBLIC_URL is advertised
          test "$(code $H/api/bots)" = 403                                        # and without the cookie it is still closed
          docker compose -f deploy/docker-compose.yml down -v
      - name: Cloud Pro home image (--target cloud-home) boots, stays private and pairs on a signed request
        # The Fly home machine, built from the same runtime as the image above, with the environment
        # openmaus-cloud's provisioner writes (docs/cloud-pro.md): Caddy on
        # :8080 is the only listener, a forwarded request is never the
        # loopback owner, a bad boot contract never serves, the launcher stays
        # root (and runs only root's code) while the server and the edge run as
        # maus with no secret in their environment, and only an HMAC-signed,
        # fresh, unreplayed request opens a
        # single-use pairing window, also after a restart. Cloud Pro includes
        # no AI: the machine boots without any model gateway, serves no
        # included models, and tells the paired app to open its engine sign-in.
        run: |
          set -euo pipefail
          docker build --target cloud-home --build-arg CLOUD_HOME_ENGINES= -t omb-cloud-home:ci .
          rand43() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          b64url() { base64 | tr '+/' '-_' | tr -d '=\n'; }
          secret=$(rand43)
          test "${#secret}" = 43
          host=omb-t-0123456789ab.fly.dev
          relay=$(rand43)
          # A built Cloud registers with the real connected-apps service; this one is pointed at a closed port instead.
          contract=(-e OMB_CLOUD_ROLE=home -e OMB_CLOUD_MACHINE_ID=3f9c2a4e-8b1d-4c6e-9a7f-2d5e8c1b0a93 -e OMB_CLOUD_ADMIN_URL=https://cloud.example.test
            -e "OMB_PUBLIC_URL=https://$host" -e "OMB_CLOUD_BOOTSTRAP_SECRET=$secret" -e "OMB_CLOUD_BOAT_TOKEN=box_omb_$relay"
            -e OMB_COMPOSIO_BROKER_URL=http://127.0.0.1:9)
          # An incomplete contract exits instead of serving.
          if timeout 60 docker run --name home-bad -e OMB_CLOUD_ROLE=home omb-cloud-home:ci; then echo "an incomplete contract served"; exit 1; fi
          grep -q "Cloud home configuration is invalid" <<<"$(docker logs home-bad 2>&1)"
          docker rm -f home-bad >/dev/null
          # A Fly Machine runs the launcher as root with every capability; Docker's defaults leave out the one that lowers an OOM score.
          docker run -d --name home --cap-add SYS_RESOURCE -p 127.0.0.1:18080:8080 -v omb-home-ci:/data "${contract[@]}" omb-cloud-home:ci
          E=http://127.0.0.1:18080
          healthy() {
            for i in $(seq 1 45); do
              curl -sf --max-time 2 "$E/api/health" | grep -q openmausbot && return 0
              sleep 2
            done
            docker logs home; echo "the cloud home never became healthy"; return 1
          }
          healthy
          logs=$(docker logs home 2>&1)
          grep -qF "bots run on the engines the person signs in to here" <<<"$logs"
          if grep -qF "ignoring OMB_HOSTED" <<<"$logs"; then echo "a model gateway reached the boot contract"; exit 1; fi
          if grep -qF "$secret" <<<"$logs"; then echo "the bootstrap secret reached the log"; exit 1; fi
          # The launcher stays root; the server and the edge run as maus. Chosen
          # by command line (a node process's comm is not always "node"), from
          # outside the container so no probe matches itself.
          maus=$(docker exec home id -u maus)
          procs=$(docker top home -eo pid,uid,args)   # docker top needs the pid column
          echo "$procs"
          uids() { awk -v pat="$1" 'NR > 1 && index($0, pat) { print $2 }' <<<"$procs" | sort -u | tr '\n' ' '; }
          test "$(uids dist-server/cloud-home-start.js)" = "0 "
          test "$(uids dist-server/index.js)" = "$maus "
          test "$(uids 'caddy run')" = "$maus "
          # No secret in the server's starting environment, read as any maus process (an
          # engine's shell) can read it: root in the container lacks CAP_SYS_PTRACE for that.
          spid=$(docker exec home sh -c 'for p in /proc/[0-9]*; do case "$(tr "\0" " " < "$p/cmdline" 2>/dev/null)" in *"dist-server/in""dex.js"*) echo "${p#/proc/}";; esac; done')
          test -n "$spid"
          docker exec -u maus home grep -qaF OMB_CLOUD_ROLE=home "/proc/$spid/environ"         # the probe reads it
          # Out of memory, the kernel takes the engines first and the server and the edge (the health check) last.
          test "$(docker exec home cat "/proc/$spid/oom_score_adj")" = -800
          epid=$(docker exec home sh -c 'for p in /proc/[0-9]*; do case "$(tr "\0" " " < "$p/cmdline" 2>/dev/null)" in *"caddy r""un"*) echo "${p#/proc/}";; esac; done')
          test "$(docker exec home cat "/proc/$epid/oom_score_adj")" = -900
          for value in "$secret" "box_omb_$relay"; do
            if docker exec -u maus home grep -qaF -- "$value" "/proc/$spid/environ"; then echo "a secret is in the server's environment"; exit 1; fi
          done
          # The root launcher runs only code maus cannot change; maus owns only the volume.
          docker exec -u maus home sh -c 'for f in /app /app/dist-server /app/dist-server/index.js /app/dist-server/cloud-home-start.js /app/cloud/Caddyfile /usr/local/bin/caddy; do if test -w "$f"; then echo "maus can write $f"; exit 1; fi; done; test -w /data'
          test "$(docker exec home stat -c %U /app/dist-server/index.js)" = root
          # The shell tools bots use on a Cloud, as the user their engines run as.
          docker exec -u maus home sh -c 'python3 -c "import json, sqlite3, zipfile, csv" && pdftotext -v 2>&1 | grep -q pdftotext && unzip -v | grep -q UnZip'
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$@"; }
          H=(-H "Host: $host")
          test "$(code "${H[@]}" $E/api/bots)" = 403                       # through the edge: never the owner
          test "$(code -H 'Host: localhost' $E/api/bots)" = 403            # another name is refused at the edge
          # The Admin's request (openmaus-cloud cloudPairingSignature).
          pair() { # body key timestamp nonce -> prints the HTTP status, keeps the reply in $reply
            local body=$1 key=$2 ts=$3 nonce=$4 bh sig
            bh=$(printf %s "$body" | openssl dgst -sha256 -binary | b64url)
            sig=$(printf 'v1\n%s\n%s\nPOST\n/api/cloud/pairing\n%s' "$ts" "$nonce" "$bh" | openssl dgst -sha256 -hmac "$key" -binary | b64url)
            curl -s -o /tmp/pair-reply -w '%{http_code}' --max-time 5 "${H[@]}" -X POST -H 'content-type: application/json' \
              -H "x-omb-cloud-timestamp: $ts" -H "x-omb-cloud-nonce: $nonce" -H "x-omb-cloud-signature: v1=$sig" --data-binary "$body" $E/api/cloud/pairing
          }
          body='{"label":"OpenMausBot app (Cloud)","ttlSeconds":300}'
          test "$(pair "$body" "$(rand43)" "$(date +%s)" "$(rand43)")" = 401                 # wrong key
          test "$(pair "$body" "$secret" "$(( $(date +%s) - 400 ))" "$(rand43)")" = 401      # stale
          nonce=$(rand43); now=$(date +%s)
          test "$(pair "$body" "$secret" "$now" "$nonce")" = 200
          test "$(jq -r 'keys | join(",")' /tmp/pair-reply)" = "code,credential,expiresAt"
          pcode=$(jq -r .code /tmp/pair-reply)
          test "$(pair "$body" "$secret" "$now" "$nonce")" = 401                            # replayed
          session=$(curl -sf "${H[@]}" -X POST -H 'content-type: application/json' -d "{\"code\":\"$pcode\"}" $E/api/auth/pair | jq -r .token)
          test "$(code "${H[@]}" -H "Authorization: Bearer $session" $E/api/bots)" = 200
          test "$(code "${H[@]}" -X POST -H 'content-type: application/json' -d "{\"code\":\"$pcode\"}" $E/api/auth/pair)" = 401   # single use
          # No included models: only the person's own engines, and the app opens its engine sign-in.
          curl -sf "${H[@]}" -H "Authorization: Bearer $session" $E/api/instances \
            | jq -e '(.instances | length) > 0 and ([.instances[] | select((.instanceId | startswith("included.")) or has("included") or .readOnly == true)] | length == 0)'
          curl -sf "${H[@]}" -H "Authorization: Bearer $session" $E/api/auth/session | jq -e '.cloudHome == true and (has("hosted") | not)'
          # Only the edge is reachable from the network, never the server itself.
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' home)
          probe() { docker run --rm --network bridge curlimages/curl:8.14.1 -s -o /dev/null --max-time 3 "http://$1:$2/api/health"; }
          probe "$ip" 8080 || { echo "the edge is not reachable on $ip; the check below would be vacuous"; exit 1; }
          if probe "$ip" 8799 || probe "$ip" 8800; then echo "the server answered on $ip"; exit 1; fi
          # After a restart the volume is recognised, the session survives and pairing still needs a signature.
          docker restart home >/dev/null
          healthy
          test "$(code "${H[@]}" -H "Authorization: Bearer $session" $E/api/bots)" = 200
          test "$(pair "$body" "$(rand43)" "$(date +%s)" "$(rand43)")" = 401
          test "$(pair "$body" "$secret" "$(date +%s)" "$(rand43)")" = 200
          docker rm -f home >/dev/null
          docker volume rm omb-home-ci >/dev/null
      - name: Cloud home on an own server trusts only its tunnel to name a client, and starts again after an unclean kill
        # Without FLY_APP_NAME the home is on its own server, where any local process reaches the published port: only
        # the tunnel, in the home's own network namespace, names the client (Cf-Connecting-IP from loopback), so a header
        # forged through the port cannot reset the pairing lockout. With FLY_APP_NAME, Fly's proxy names it, as before.
        # A SIGKILL leaves the server's lease on the volume; on one Docker host every container shares the boot id and
        # its pids start again from 1. The same container and a new one both start again on that volume, and a second
        # home beside a live one refuses to start.
        run: |
          set -euo pipefail
          rand43() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          b64url() { base64 | tr '+/' '-_' | tr -d '=\n'; }
          secret=$(rand43)
          host=home.own-server.invalid
          contract=(-e OMB_CLOUD_ROLE=home -e OMB_CLOUD_MACHINE_ID=7d1e2f3a-4b5c-4d6e-8f70-8192a3b4c5d6 -e OMB_CLOUD_ADMIN_URL=https://cloud.example.test
            -e "OMB_PUBLIC_URL=https://$host" -e "OMB_CLOUD_BOOTSTRAP_SECRET=$secret" -e OMB_COMPOSIO_BROKER_URL=http://127.0.0.1:9 -e OMB_HIGHLEVEL_RELAY_URL=off)
          run_home() { # name volume port [docker run options...]
            local name=$1 volume=$2 port=$3; shift 3
            docker run -d --name "$name" --init --stop-timeout 30 -p "127.0.0.1:$port:8080" -v "$volume:/data" "${contract[@]}" "$@" omb-cloud-home:ci >/dev/null
          }
          healthy() { # name port
            for i in $(seq 1 45); do
              curl -sf --max-time 2 "http://127.0.0.1:$2/api/health" | grep -q openmausbot && return 0
              if [ "$(docker inspect -f '{{.State.Running}}' "$1")" != true ]; then docker logs "$1" 2>&1 | tail -20; echo "$1 exited"; return 1; fi
              sleep 2
            done
            docker logs "$1" 2>&1 | tail -20; echo "$1 never became healthy"; return 1
          }
          # A pairing signed with a wrong key: it counts toward the lockout of the address the edge names (10 a minute).
          bad_pair_headers() {
            local ts nonce bh sig
            ts=$(date +%s); nonce=$(rand43)
            bh=$(printf '{}' | openssl dgst -sha256 -binary | b64url)
            sig=$(printf 'v1\n%s\n%s\nPOST\n/api/cloud/pairing\n%s' "$ts" "$nonce" "$bh" | openssl dgst -sha256 -hmac "$(rand43)" -binary | b64url)
            printf '%s\n' -H "Host: $host" -H 'content-type: application/json' -H "x-omb-cloud-timestamp: $ts" -H "x-omb-cloud-nonce: $nonce" -H "x-omb-cloud-signature: v1=$sig"
          }
          bad_pair() { # port [curl options...]: through the published port, from the host
            local port=$1; shift; local signed; mapfile -t signed < <(bad_pair_headers)
            curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST "${signed[@]}" "$@" --data-binary '{}' "http://127.0.0.1:$port/api/cloud/pairing"
          }
          bad_pair_from_tunnel() { # name [curl options...]: from the home's own loopback, where the tunnel connects from
            local name=$1; shift; local signed; mapfile -t signed < <(bad_pair_headers)
            docker exec "$name" curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X POST "${signed[@]}" "$@" --data-binary '{}' http://127.0.0.1:8080/api/cloud/pairing
          }

          # Own server: every request through the port counts against the port's one peer, whatever address it forges.
          run_home own omb-own-ci 18081
          healthy own 18081
          for i in $(seq 1 10); do
            test "$(bad_pair 18081 -H "Cf-Connecting-IP: 198.51.100.$i" -H "Fly-Client-IP: 203.0.113.$i" -H "X-Forwarded-For: 192.0.2.$i")" = 401
          done
          test "$(bad_pair 18081 -H 'Cf-Connecting-IP: 198.51.100.99' -H 'Fly-Client-IP: 203.0.113.99')" = 429
          # The tunnel does name the client, so the person behind it is not locked out with the port's peer; Fly's header names nobody.
          test "$(bad_pair_from_tunnel own -H 'Cf-Connecting-IP: 198.51.100.200')" = 401
          test "$(bad_pair_from_tunnel own -H 'Fly-Client-IP: 203.0.113.200')" = 401
          for i in $(seq 1 9); do bad_pair_from_tunnel own -H 'Fly-Client-IP: 203.0.113.201' >/dev/null; done
          test "$(bad_pair_from_tunnel own -H 'Cf-Connecting-IP: 198.51.100.201')" = 401
          test "$(bad_pair_from_tunnel own -H 'Fly-Client-IP: 203.0.113.202')" = 429

          # Fly: the proxy's private address names the client in Fly-Client-IP, exactly as before.
          run_home fly omb-fly-ci 18082 -e FLY_APP_NAME=omb-t-ci
          healthy fly 18082
          for i in $(seq 1 10); do test "$(bad_pair 18082 -H 'Fly-Client-IP: 203.0.113.7' -H "Cf-Connecting-IP: 198.51.100.$i")" = 401; done
          test "$(bad_pair 18082 -H 'Fly-Client-IP: 203.0.113.7')" = 429
          test "$(bad_pair 18082 -H 'Fly-Client-IP: 203.0.113.8')" = 401
          docker rm -f fly >/dev/null
          docker volume rm omb-fly-ci >/dev/null

          # A SIGKILL leaves the server's lease behind; the same container starts again, and so does a new one.
          docker kill -s KILL own >/dev/null
          docker run --rm -v omb-own-ci:/data:ro --entrypoint test omb-cloud-home:ci -s /data/.openmausbot/openmausbot-server.lease
          docker start own >/dev/null
          healthy own 18081
          docker kill -s KILL own >/dev/null
          docker rm -f own >/dev/null
          run_home own2 omb-own-ci 18081
          healthy own2 18081
          grep -q 7d1e2f3a-4b5c-4d6e-8f70-8192a3b4c5d6 <<<"$(docker run --rm -v omb-own-ci:/data:ro --entrypoint cat omb-cloud-home:ci /data/.omb-cloud-home.json)"
          # A second home on the volume the live one holds refuses to start, and the live one carries on.
          if timeout 90 docker run --name own3 -v omb-own-ci:/data "${contract[@]}" omb-cloud-home:ci; then echo "a second home started on a held volume"; exit 1; fi
          grep -qF "Another MausBot home is already running on this volume. No data was changed." <<<"$(docker logs own3 2>&1)"
          docker rm -f own3 >/dev/null
          healthy own2 18081
          docker rm -f own2 >/dev/null
          docker volume rm omb-own-ci >/dev/null
      - name: Prove each image ships its files once, no build cache, and a Caddy without capabilities
        # A pull downloads every layer, so a file written twice or a cache left
        # in a layer costs every machine that pulls the image. The Cloud home's
        # Caddy must not carry the privileged-port capability (it runs as maus
        # on :8080), which Docker's default capabilities would hide at runtime.
        # Its Grok is one root-owned binary, with nothing from the installer's
        # throwaway home left in the image.
        run: |
          set -euo pipefail
          docker save openmausbot:ci -o "$RUNNER_TEMP/server.tar"
          docker save omb-cloud-home:ci -o "$RUNNER_TEMP/home.tar"
          python3 - "$RUNNER_TEMP/server.tar" "$RUNNER_TEMP/home.tar" <<'PY'
          import json, re, sys, tarfile
          cache = re.compile(r"^(root/\.npm|tmp/(npm-cache|omb-build-home|node-compile-cache|grok-install))/")
          for path in sys.argv[1:]:
              files = {}
              with tarfile.open(path) as image:
                  for layer in json.load(image.extractfile("manifest.json"))[0]["Layers"]:
                      with tarfile.open(fileobj=image.extractfile(layer), mode="r|*") as entries:
                          for entry in entries:
                              name = entry.name[2:] if entry.name.startswith("./") else entry.name
                              if not entry.isdir():
                                  files.setdefault(name, []).append(entry)
              left = sorted(name for name in files if cache.match(name))
              assert not left, f"{path}: build caches in a layer: {left[:5]}"
              assert len(files["app/dist-server/index.js"]) == 1, f"{path}: the app is written more than once"
              native = [name for name in files if re.match(r"usr/local/lib/node_modules/agent-browser/bin/agent-browser-", name)]
              assert len(native) == 1, f"{path}: agent-browser ships {native}"
              if path.endswith("home.tar"):
                  caddy = files["usr/local/bin/caddy"]
                  assert len(caddy) == 1, f"Caddy is written {len(caddy)} times"
                  assert caddy[0].uid == 0, f"Caddy belongs to uid {caddy[0].uid}"
                  assert not any(key.startswith("SCHILY.xattr.security.") for key in caddy[0].pax_headers), "Caddy keeps a file capability"
                  grok = files["usr/local/bin/grok"]
                  assert len(grok) == 1 and grok[0].uid == 0 and grok[0].mode & 0o7777 == 0o755, "Grok is not one root-owned 0755 binary"
                  installer = sorted(name for name in files if re.match(r"(data|root)/\.grok/|usr/local/bin/agent$", name))
                  assert not installer, f"Grok's installer left files behind: {installer[:5]}"
              print(f"{path}: {len(files)} files, each once; no build cache; {native[0]}")
          PY

  publish:
    name: publish to GHCR
    needs: build-and-smoke
    # Release dispatches on its published tag because GITHUB_TOKEN-created
    # tags do not start another workflow. A manual branch run is smoke-only.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: keys
        # What the two slow layers install: `agent-browser install` fetches
        # Chrome for Testing's last-known-good Stable, and the Cloud home takes
        # each engine's npm latest. Keyed on those versions, the layers (and
        # their digests) carry over from the last publish until a release; a
        # code-only push re-pulls only the app layers. A lookup that fails keys
        # on today's date instead, so neither is ever frozen at an old release.
        env:
          CLOUD_HOME_ENGINES: "@anthropic-ai/claude-code @openai/codex"
        run: |
          today="date-$(date -u +%F)"
          chrome=$(curl -fsSL --max-time 30 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -er .channels.Stable.version) || chrome=""
          [[ "$chrome" =~ ^[0-9]+(\.[0-9]+)+$ ]] || chrome=$today
          engines="" engines_tag=""
          for package in $CLOUD_HOME_ENGINES; do
            version=$(npm view "$package@latest" version 2>/dev/null) || version=""
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9][0-9A-Za-z.+-]*$ ]]; then engines=$CLOUD_HOME_ENGINES engines_tag=$today; break; fi
            engines="$engines $package@$version"
          done
          { echo "chrome=$chrome"; echo "engines=${engines# }"; echo "engines_tag=$engines_tag"; } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Cloud Pro home machine (the Dockerfile's cloud-home target), on the
      # same runtime layers as the server image just pushed, with Claude Code,
      # Codex and Grok baked in. The Admin pins it by digest
      # (OMB_CLOUD_HOME_IMAGE=ghcr.io/milind-soni/openmausbot-cloud-home@sha256:...).
      - id: repo
        # Image references must be lowercase; the repository name is not.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: home-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}-cloud-home
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: home
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: cloud-home
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
            CLOUD_HOME_ENGINES=${{ steps.keys.outputs.engines }}
            ENGINES_CACHE_TAG=${{ steps.keys.outputs.engines_tag }}
          push: true
          tags: ${{ steps.home-meta.outputs.tags }}
          labels: ${{ steps.home-meta.outputs.labels }}
          # The build and runtime layers come from the server's cache; the
          # engine and edge layers from this image's own.
          cache-from: |
            type=gha
            type=gha,scope=cloud-home
          cache-to: type=gha,scope=cloud-home,mode=max
      - name: Cloud home image digest
        env:
          DIGEST: ${{ steps.home.outputs.digest }}
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}-cloud-home
        run: echo "OMB_CLOUD_HOME_IMAGE=${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
