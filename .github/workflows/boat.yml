# Linux checks on Boat (https://docs.boat.dev/ci), so pull requests get results without waiting for GitHub's hosted
# runners. The same split as ci.yml's Linux leg (scripts/ci-scope.mjs: 8 shards, every e2e file, one file at a time per
# shard, so one VM per shard): lint and typecheck on one boat-large VM, each vitest shard on its own boat-large VM (8 vCPU, 16 GB: GitHub's
# ubuntu-latest has 16 GB, and typecheck runs out of heap on 8 GB).
# Runs only while the repository variable BOAT_CI is "on", and only for this repository's own branches (a fork's pull
# request never runs on Boat). Boat runs a public repository's job only when the run's author and whoever started it
# are both on its allow-list (`boat ci public`: the repository owner), and a job it refuses waits for a runner that
# never comes, so runs anyone else authored or started stay off Boat. ci.yml is unchanged.
name: Boat

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: boat-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Lint and typecheck (Boat)
    if: >-
      vars.BOAT_CI == 'on'
      && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
      && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == github.repository_owner))
    runs-on: boat-large
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=12288

  vitest:
    name: Linux vitest (Boat, shard ${{ matrix.shard }}/8)
    if: >-
      vars.BOAT_CI == 'on'
      && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
      && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login == github.repository_owner))
    runs-on: boat-large
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Boat's image sets en_US.UTF-8, whose collation is Intl's default; GitHub's runners use C.UTF-8 and UTC.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    defaults:
      run:
        # Boat's runner gives every process cap_dac_read_search as an ambient capability, so a test can still read a
        # file it set to mode 000, and Boat's desktop sets DISPLAY. GitHub's runners have neither.
        shell: setpriv --inh-caps=-all --ambient-caps=-all -- env -u DISPLAY -u XAUTHORITY bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove what Boat installs and GitHub's runners lack
        # The server starts an engine it finds on PATH: Boat's Hermes then downloads its own Python, Node and tools into
        # each test's home, about nine seconds for every test that adds a bot. A Team Cloud runs its turns in a
        # bubblewrap box wherever bwrap works; bwrap refuses to start while it holds a capability, so it worked here
        # only once the job's shell dropped Boat's, and it never works on a GitHub runner.
        run: sudo rm -f /usr/bin/bwrap /usr/local/bin/{agent,claude,codex,cua-driver,cursor-agent,hermes,hermes-acp,hermes-agent,kimi,openclaw,opencode,pi,prime-agent,vibe,vibe-acp}
      - name: Prepare Electron test runtime
        # As in ci.yml: Electron downloads its runtime on first import, which must not use up a test's timeout.
        run: node --input-type=commonjs -e "require('electron')"
      - name: vitest shard ${{ matrix.shard }}/8 (every e2e file, as ci.yml's Linux shards)
        env:
          OMB_VITEST_E2E: all
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/8 --reporter=default --reporter=github-actions
      - name: Retried tests
        if: always()
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
        run: node scripts/testing/ci-retry-summary.mjs
      - name: Node tests (broker, Electron main)
        if: matrix.shard == 1
        run: pnpm broker:test && pnpm test:electron
