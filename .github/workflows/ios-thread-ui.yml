name: iOS thread UI

# The offline iPhone + iPad simulator suite from docs/verification/ios-threads.md.
# It needs about 90 minutes of one macOS runner, and the account runs only five
# macOS jobs at a time, so it is not part of every change's CI (ci.yml still
# runs the Swift tests and the simulator build for iOS changes). It runs every
# night, after main pushes that touch the app, and by hand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/verify-ios-thread-navigation-ci.sh"
      - ".github/workflows/ios-thread-ui.yml"

permissions:
  contents: read

concurrency:
  # One suite at a time; a newer main push replaces a run still waiting.
  group: ios-thread-ui
  cancel-in-progress: true

jobs:
  thread-ui:
    name: iOS thread UI (iPhone + iPad simulators)
    runs-on: macos-latest
    # The iPhone suite and the iPad roster suite finished inside 60 minutes
    # with the iPad UI suite still running; the whole matrix needs about 85.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Verify thread navigation on disposable iPhone and iPad simulators
        # `xcodebuild test` builds the app itself, so there is no separate
        # simulator build step here.
        run: bash scripts/verify-ios-thread-navigation-ci.sh
      - name: Keep native thread test results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-thread-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/omb-ios-threads-*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
