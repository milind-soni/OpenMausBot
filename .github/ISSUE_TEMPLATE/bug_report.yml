name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Chat UI (src/)
        - Harness server / API (server/)
        - Provider drivers (claude / codex / grok)
        - Computer use (cloud box / local)
        - Connected apps (Composio)
        - Desktop shell / packaging (electron/)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Opened the Computer panel on a fresh bot
        2. Expected the box to provision
        3. Got a spinner forever; the server log says …
    validations:
      required: true
  - type: input
    attributes:
      label: Version and install
      description: App version (About / release tag) and whether you run the .dmg or from source
      placeholder: v0.1.3 dmg · macOS 15.5
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: >-
        Anything from the terminal running `pnpm dev:server`, or the per-thread
        event logs in `~/.astra/events/`. Redact anything that looks like
        a key or token before pasting.
      render: text
