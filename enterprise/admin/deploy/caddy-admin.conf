# /etc/systemd/system/caddy.service.d/openmausbot-admin.conf
# Assumes the distribution's caddy.service runs as caddy:caddy.
[Service]
RuntimeDirectory=caddy-admin
RuntimeDirectoryMode=0750
UMask=0027
ExecReload=
ExecReload=/usr/bin/caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --address unix//run/caddy-admin/admin.sock --force
