<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">OTECH</title>
  <desc id="desc">OTECH modern emblem with blue to cyan gradient and circular geometry.</desc>
  <defs>
    <linearGradient id="otech-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="45%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="otech-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003882" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#070C18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#04070E" stop-opacity="1" />
    </radialGradient>
    <clipPath id="circle-clip">
      <circle cx="512" cy="512" r="480" />
    </clipPath>
  </defs>

  <!-- Circular Outer Bounds -->
  <circle cx="512" cy="512" r="512" fill="#04070E" />
  <circle cx="512" cy="512" r="496" fill="url(#bg-glow)" />

  <!-- Ambient Glow Ring -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#otech-glow)" stroke-width="8" />

  <g clip-path="url(#circle-clip)">
    <!-- Outer Kinetic Orbital Arc -->
    <circle cx="512" cy="512" r="390" fill="none" stroke="url(#otech-grad)" stroke-width="22" stroke-linecap="round" stroke-dasharray="1400 400" transform="rotate(-40 512 512)" />

    <!-- Main OTECH Monogram Symbol -->
    <!-- Geometric futuristic 'O' loop -->
    <path fill="url(#otech-grad)" fill-rule="evenodd" d="M 512 180 C 695.36 180 844 328.64 844 512 C 844 695.36 695.36 844 512 844 C 328.64 844 180 695.36 180 512 C 180 328.64 328.64 180 512 180 Z M 512 284 C 386.08 284 284 386.08 284 512 C 284 637.92 386.08 740 512 740 C 637.92 740 740 637.92 740 512 C 740 386.08 637.92 284 512 284 Z" />

    <!-- Precision Tech Core / Energy Chevron inside the 'O' -->
    <path fill="#FFFFFF" fill-opacity="0.95" d="M 512 348 L 628 512 L 512 676 L 474 622 L 552 512 L 474 402 Z" />
    <path fill="url(#otech-grad)" d="M 444 348 L 560 512 L 444 676 L 396 676 L 512 512 L 396 348 Z" />

    <!-- Corner Tech Nodes -->
    <circle cx="512" cy="232" r="14" fill="#00F2FE" />
    <circle cx="512" cy="792" r="14" fill="#0052FF" />
    <circle cx="232" cy="512" r="14" fill="#0088FF" />
    <circle cx="792" cy="512" r="14" fill="#00E1FE" />
  </g>
</svg>
