<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gerer Build Studio</title>
  <desc id="desc">A Studio-blue Gerer Buddy, its scalloped body slightly turned, looking up and to the left from a dark rounded tile.</desc>

  <defs>
    <!-- macOS icon grid: an 824 tile inset 100 from the canvas, room for the shadow. -->
    <clipPath id="tile-clip">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>

    <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#18243A" />
      <stop offset="0.55" stop-color="#0E1626" />
      <stop offset="1" stop-color="#070B13" />
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1084FE" stop-opacity="0.48" />
      <stop offset="0.6" stop-color="#1084FE" stop-opacity="0.12" />
      <stop offset="1" stop-color="#1084FE" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="body" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7DBEFF" />
      <stop offset="0.45" stop-color="#1084FE" />
      <stop offset="1" stop-color="#0757C2" />
    </linearGradient>

    <radialGradient id="shine" cx="0.36" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <filter id="buddy-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000A1A" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tile-shadow)" />

  <g clip-path="url(#tile-clip)">
    <circle cx="512" cy="540" r="420" fill="url(#glow)" />

    <!-- The Buddy, from Assets/Buddy Avater on its 1024 guide canvas, at 60%. -->
    <g transform="translate(512 528) scale(0.6) translate(-512 -512)">
      <g filter="url(#buddy-shadow)">
        <g transform="rotate(9 512 512)">
          <path transform="matrix(1.769343,1.021531,-1.021531,1.769343,97.81171,-1319.392747)" fill="url(#body)" d="M623.767,424.333C660.019,424.333 692.739,442.428 709.774,467.298C739.405,461.757 775.336,472.099 800.971,497.733C826.605,523.368 836.947,559.299 831.406,588.93C856.276,605.965 874.371,638.685 874.371,674.937C874.371,711.19 856.276,743.91 831.406,760.944C836.947,790.575 826.605,826.507 800.971,852.141C775.336,877.776 739.405,888.117 709.774,882.576C692.739,907.447 660.019,925.542 623.767,925.542C587.514,925.542 554.794,907.447 537.76,882.576C508.129,888.117 472.197,877.776 446.563,852.141C420.929,826.507 410.587,790.575 416.128,760.944C391.257,743.91 373.162,711.19 373.162,674.937C373.162,638.685 391.257,605.965 416.128,588.93C410.587,559.299 420.929,523.368 446.563,497.733C472.197,472.099 508.129,461.757 537.76,467.298C554.794,442.428 587.514,424.333 623.767,424.333Z" />
        </g>
      </g>
      <g transform="rotate(9 512 512)">
          <path transform="matrix(1.769343,1.021531,-1.021531,1.769343,97.81171,-1319.392747)" fill="url(#shine)" d="M623.767,424.333C660.019,424.333 692.739,442.428 709.774,467.298C739.405,461.757 775.336,472.099 800.971,497.733C826.605,523.368 836.947,559.299 831.406,588.93C856.276,605.965 874.371,638.685 874.371,674.937C874.371,711.19 856.276,743.91 831.406,760.944C836.947,790.575 826.605,826.507 800.971,852.141C775.336,877.776 739.405,888.117 709.774,882.576C692.739,907.447 660.019,925.542 623.767,925.542C587.514,925.542 554.794,907.447 537.76,882.576C508.129,888.117 472.197,877.776 446.563,852.141C420.929,826.507 410.587,790.575 416.128,760.944C391.257,743.91 373.162,711.19 373.162,674.937C373.162,638.685 391.257,605.965 416.128,588.93C410.587,559.299 420.929,523.368 446.563,497.733C472.197,472.099 508.129,461.757 537.76,467.298C554.794,442.428 587.514,424.333 623.767,424.333Z" />
      </g>
      <g fill="#FBEAFF">
        <path transform="matrix(1.380726,0,0,1.131783,-48.195736,-101.937984)" d="M253,341C289.426,341 319,377.079 319,421.517L319,518.483C319,562.921 289.426,599 253,599C216.574,599 187,562.921 187,518.483L187,421.517C187,377.079 216.574,341 253,341Z" />
        <path transform="matrix(1.380726,0,0,1.131783,214.54845,-101.937984)" d="M253,341C289.426,341 319,377.079 319,421.517L319,518.483C319,562.921 289.426,599 253,599C216.574,599 187,562.921 187,518.483L187,421.517C187,377.079 216.574,341 253,341Z" />
      </g>
    </g>
  </g>

  <!-- Hairline edge so the tile holds on dark docks. -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
</svg>
