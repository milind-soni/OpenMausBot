appId: com.gererbuildstudio.app
productName: Gerer Build Studio
artifactName: GererBuildStudio-${version}-${arch}.${ext}
publish: null

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/updater.mjs"
  - "!electron/vendor/electron-updater.cjs"
  - "!electron/resources/speech-helper"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
  # The standalone harness imports the shared project service at runtime.
  - from: electron/projects.mjs
    to: electron/projects.mjs

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed macOS binary — Windows never sees it
  extraResources:
    - from: electron/resources/speech-helper
      to: speech-helper
  extendInfo:
    NSMicrophoneUsageDescription: Gerer Build Studio uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Gerer Build Studio transcribes your voice on-device to type messages for you.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  artifactName: GererBuildStudio-${version}.dmg
  title: Gerer Build Studio ${version}
  # Studio-blue installer window; source in build/dmg/background.html.
  background: build/background.png
  backgroundColor: "#0a101c"
  icon: build/icon.icns
  iconSize: 112
  iconTextSize: 13
  window:
    width: 660
    height: 420
  contents:
    - x: 165
      y: 215
    - x: 495
      y: 215
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  artifactName: GererBuildStudio-${version}-setup.${ext}
